<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ventajas</title>
  <link rel="stylesheet" href="style.css">
  <script src="./navbar.js" defer></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <navbar-header></navbar-header>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="text-center mb-8">
      <span class="bg-primary/10 text-primary text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Promociones y Beneficios</span>
      <h1 class="text-3xl font-extrabold text-gray-900 mt-2">Ventajas</h1>
      <p id="subtituloEvento" class="text-gray-600 text-sm mt-1">Cargando ventajas exclusivas...</p>
      <p id="mensaje" class="text-slate-600 text-base leading-relaxed mt-4">
                Cargando información del evento...
            </p>
    </div>

    <!-- Contenedor donde se inyectarán las cards -->
    <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="col-span-full text-center py-12 text-gray-400">Cargando ventajas...</div>
    </div>



  </main>

  <script type="module">
    import { db } from './firebase.config.js';
    import { collection, doc, getDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const urlParams = new URLSearchParams(window.location.search);
    const slugParam = urlParams.get('evento') || urlParams.get('id');
    const code = urlParams.get('code');
    const evento = urlParams.get('evento');
    
    async function cargarVentajasPublicas() {
      const container = document.getElementById("cards-container");
      const subtitulo = document.getElementById("subtituloEvento");

      if (!slugParam) {
        container.innerHTML = `<div class="col-span-full text-center p-6 bg-white rounded-xl shadow-sm text-red-500">⚠️ No se ha especificado ningún evento en la URL (ej: <code>?evento=nombre-evento</code>).</div>`;
        subtitulo.textContent = "Evento no especificado";
        return;
      }

      try {
        let eventoId = slugParam;

        // Intentar resolver por ID directo o campo slug por si acaso
        const refDirecta = doc(db, "eventos", slugParam);
        const snapDirecto = await getDoc(refDirecta);

        if (snapDirecto.exists()) {
          subtitulo.textContent = `Evento: ${snapDirecto.data().nombre}`;
        } else {
          const q = query(collection(db, "eventos"), where("slug", "==", slugParam));
          const snapshotEv = await getDocs(q);
          if (!snapshotEv.empty) {
            eventoId = snapshotEv.docs[0].id;
            subtitulo.textContent = `Evento: ${snapshotEv.docs[0].data().nombre}`;
          } else {
            subtitulo.textContent = "Evento";
          }
        }

        // Leer la subcolección ventajas
        const ventajasSnap = await getDocs(collection(db, "eventos", eventoId, "ventajas"));

        if (ventajasSnap.empty) {
          container.innerHTML = `<div class="col-span-full text-center p-8 bg-white rounded-xl shadow-sm text-gray-500">No hay ventajas disponibles para este evento en este momento.</div>`;
          return;
        }

        container.innerHTML = "";

        ventajasSnap.forEach((docSnap) => {
          const v = docSnap.data();

          // Renderizado condicional de elementos opcionales
          const imagenHTML = v.foto ? `<img src="${v.foto}" alt="${v.nombre}" class="object-cover rounded-t-xl">` : '';
          const fechaHTML = v.fechaCaducidad ? `<span class="text-xs font-semibold text-red-600 bg-red-50 px-2.5 py-1 rounded-full">⏳ Caduca: ${v.fechaCaducidad}</span>` : '';
          const descHTML = v.descripcion ? `<p class="text-gray-600 text-sm mt-2">${v.descripcion}</p>` : '';
          const htmlEmbedHTML = v.htmlEmbedded ? `<div class="mt-3 overflow-hidden rounded-lg">${v.htmlEmbedded}</div>` : '';
          
          let botonHTML = '';
          if (v.actionButton && v.textButton) {
            botonHTML = `<div class="mt-4"><a href="${v.actionButton}" target="_blank" class="btn-primary inline-block text-center w-full py-2 text-xs font-bold rounded-lg">${v.textButton}</a></div>`;
          }

          let codigosHTML = '';
          if (v.codigos && v.codigos.length <= 0) {v.codigos.push(code)}
            codigosHTML = `
              <div class="mt-4 bg-green-100 p-3 rounded-lg border border-gray-100">
                <span class="text-xs font-bold text-gray-700 block mb-1">Códigos disponibles:</span>
                <div class="flex flex-wrap gap-1.5">
                  ${v.codigos.map(c => `<code class="bg-white border border-gray-200 text-gray-800 px-2 py-0.5 rounded text-xs font-mono font-bold">${c}</code>`).join('')}
                </div>
              </div>
            `;
          

          const card = document.createElement("div");
          card.className = "bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col justify-between";
          card.innerHTML = `
            <div>
              ${imagenHTML}
              <div class="p-6 space-y-3">
                <div class="flex justify-between items-start gap-2">
                  <h3 class="text-lg font-bold text-gray-900">${v.nombre}</h3>
                  ${fechaHTML}
                </div>
                ${descHTML}
                ${htmlEmbedHTML}
                ${codigosHTML}
              </div>
            </div>
            <div class="p-6 pt-0">
              ${botonHTML}
            </div>
          `;

          container.appendChild(card);
        });

      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="col-span-full text-center p-6 bg-white rounded-xl shadow-sm text-red-500">Error al cargar las ventajas: ${err.message}</div>`;
      }
    }

    cargarVentajasPublicas();

        // 3. Seleccionar el elemento del DOM donde mostraremos el mensaje
        const mensajeElemento = document.getElementById('mensaje');

        // 4. Validar si existen ambos parámetros y pintar con Tailwind
        if (evento && code) {
            mensajeElemento.innerHTML = `
                Para usar tus ventajas del evento <span class="font-bold text-indigo-600">${evento}</span>, 
                tu código será <span class="font-mono bg-slate-100 text-slate-800 px-2 py-1 rounded border border-slate-300 font-bold">${code}</span>.
            `;
        } else {
            // Mensaje por si faltan parámetros en la URL
            mensajeElemento.innerHTML = `
                <span class="text-amber-600 font-medium">Por favor, asegúrate de incluir los parámetros <code class="bg-slate-100 px-1 rounded">?evento=...&code=...</code> en la URL.</span>
            `;
        }


  </script>
</body>
</html>
