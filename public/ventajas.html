<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ventajas del Evento</title>
  <link rel="stylesheet" href="style.css">
  <script src="./navbar.js" defer></script>
  <style>
    /* Estilo y animación para el parpadeo del código */
    @keyframes parpadeo {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(0.98); }
    }
    .banner-codigo-parpadeante {
      background-color: #5da999;
      color: #ffffff;
      animation: parpadeo 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <navbar-header></navbar-header>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="text-center mb-8">
      <p id="subtituloEvento" class="text-gray-600 text-sm mt-1">Cargando ventajas exclusivas...</p>
      <p id="mensaje" class="text-slate-600 text-base leading-relaxed mt-4">
        Cargando información del evento...
      </p>
    </div>

    <!-- Contenedor donde se inyectarán las cards -->
    <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="col-span-full text-center py-12 text-gray-400">Cargando ventajas...</div>
    </div>
  </main>

  <script type="module">
    import { db } from './firebase.config.js';
    import { collection, doc, getDoc, getDocs, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const urlParams = new URLSearchParams(window.location.search);
    const slugParam = urlParams.get('evento') || urlParams.get('id');
    const code = urlParams.get('code');
    const evento = urlParams.get('evento');
    
    async function cargarVentajasPublicas() {
      const container = document.getElementById("cards-container");
      const subtitulo = document.getElementById("subtituloEvento");
      const mensajeElemento = document.getElementById('mensaje');

      if (!slugParam) {
        container.innerHTML = `<div class="col-span-full text-center p-6 bg-white rounded-xl shadow-sm text-red-500">⚠️ No se ha especificado ningún evento en la URL.</div>`;
        subtitulo.textContent = "Evento no especificado";
        return;
      }

      try {
        let eventoId = slugParam;
        let eventoData = null;

        // 1. Resolver el ID del evento y obtener sus datos (por ID directo o por campo slug)
        const refDirecta = doc(db, "eventos", slugParam);
        const snapDirecto = await getDoc(refDirecta);

        if (snapDirecto.exists()) {
          eventoId = snapDirecto.id;
          eventoData = snapDirecto.data();
          subtitulo.textContent = `Evento: ${eventoData.nombre}`;
        } else {
          const qEv = query(collection(db, "eventos"), where("slug", "==", slugParam));
          const snapshotEv = await getDocs(qEv);
          if (!snapshotEv.empty) {
            eventoId = snapshotEv.docs[0].id;
            eventoData = snapshotEv.docs[0].data();
            subtitulo.textContent = `Evento: ${eventoData.nombre}`;
          } else {
            container.innerHTML = `<div class="col-span-full text-center p-6 bg-white rounded-xl shadow-sm text-red-500">Evento no encontrado.</div>`;
            return;
          }
        }

        // 2. Verificar que se haya proporcionado un código en la URL
        if (!code) {
          document.querySelector("main").innerHTML = `
            <div class="max-w-md mx-auto my-12 bg-amber-50 border-2 border-amber-400 p-8 rounded-2xl shadow-lg text-center">
              <h1 class="text-2xl font-black text-amber-700 tracking-wider">FALTA CÓDIGO</h1>
              <p class="text-gray-600 text-sm mt-2">Por favor, asegúrate de incluir el parámetro <code>?code=...</code> en la URL.</p>
            </div>
          `;
          return;
        }

        // 3. Validar si el 'code' de la URL está contenido en el campo de texto 'codes' del evento
        let codigoValido = false;
        if (eventoData && eventoData.codes && typeof eventoData.codes === 'string') {
          const codigosPermitidos = eventoData.codes.split(',').map(c => c.trim().toLowerCase());
          if (codigosPermitidos.includes(code.trim().toLowerCase())) {
            codigoValido = true;
          }
        }

        // Si el código no es válido o no está en el campo del evento, mostramos el mensaje de error
        if (!codigoValido) {
          document.querySelector("main").innerHTML = `
            <div class="max-w-md mx-auto my-12 bg-red-50 border-2 border-red-500 p-8 rounded-2xl shadow-lg text-center">
              <h1 class="text-3xl font-black text-red-600 tracking-wider">NO EXISTEN VENTAJAS</h1>
              <p class="text-gray-600 text-sm mt-2">No existen ventajas para el código y evento proporcionado.</p>
            </div>
          `;
          return;
        }

        // Si el código SÍ es válido, mostramos el mensaje de bienvenida
        mensajeElemento.innerHTML = `
            Para usar tus ventajas del evento <span class="font-bold text-[${eventoData.color.toUpperCase()}]">${eventoData.nombre || evento}</span>, 
            tu código validado es <span class="font-mono bg-slate-100 text-slate-800 px-2 py-1 rounded border border-slate-300 font-bold">${code}</span>.
             <div class="my-4 p-3.5 rounded-xl text-center shadow-md banner-codigo-parpadeante">
              <span class="block text-[11px] font-bold uppercase tracking-widest opacity-90">USA EL CÓDIGO</span>
              <span class="text-xl font-black font-mono tracking-widest">${code}</span>
            </div>
        `;

        // 4. Leer las ventajas del evento ordenadas por 'order' de forma ascendente
        const qVentajas = query(collection(db, "eventos", eventoId, "ventajas"), orderBy("order", "asc"));
        const ventajasSnap = await getDocs(qVentajas);

        if (ventajasSnap.empty) {
          container.innerHTML = `<div class="col-span-full text-center p-8 bg-white rounded-xl shadow-sm text-gray-500">No hay ventajas disponibles para este evento en este momento.</div>`;
          return;
        }

        container.innerHTML = "";

        ventajasSnap.forEach((docSnap) => {
          const v = docSnap.data();

          const imagenHTML = v.foto ? `<img src="${v.foto}" alt="${v.nombre}" class="object-cover rounded-t-xl">` : '';
          const fechaHTML = v.fechaCaducidad ? `<span class="text-xs font-semibold bg-red-900 text-white px-2.5 py-1 rounded-full">⏳ Caduca: ${v.fechaCaducidad}</span>` : '';
          const descHTML = v.descripcion ? `<p class="text-gray-600 text-sm mt-2">${v.descripcion}</p>` : '';
          const htmlEmbedHTML = v.htmlEmbedded ? `<div class="mt-3 overflow-hidden rounded-lg">${v.htmlEmbedded}</div>` : '';
          
          // Banner con color #5da999, letras blancas y efecto de parpadeo suave
          const bannerCodigoHTML = `
            <div class="my-4 p-3.5 rounded-xl text-center shadow-md banner-codigo-parpadeante">
              <span class="block text-[11px] font-bold uppercase tracking-widest opacity-90">USA EL CÓDIGO</span>
              <span class="text-xl font-black font-mono tracking-widest">${code}</span>
            </div>
          `;

          let botonHTML = '';
          if (v.actionButton && v.textButton) {
            botonHTML = `<div><a href="${v.actionButton}" target="_blank" class="btn-primary inline-block text-center w-full py-2.5 text-xs font-bold rounded-lg shadow-sm">${v.textButton}</a></div>`;
          }

          let codigosHTML = '';
          if (v.codigos && v.codigos.length > 0) {
            codigosHTML = `
              <div class="mt-4 bg-green-100 p-3 rounded-lg border border-gray-100">
                <span class="text-xs font-bold text-gray-700 block mb-1">Códigos asociados:</span>
                <div class="flex flex-wrap gap-1.5">
                  ${v.codigos.map(c => `<code class="bg-white border border-gray-200 text-gray-800 px-2 py-0.5 rounded text-xs font-mono font-bold">${c}</code>`).join('')}
                </div>
              </div>
            `;
          }

          const card = document.createElement("div");
          card.className = "bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col justify-between";
          card.innerHTML = `
            <div>
              ${imagenHTML}
              <div class="p-6 space-y-3">
                <div class="flex justify-between items-start gap-2">
                  <h3 class="text-lg font-bold text-gray-900">${v.nombre}</h3>
                  ${fechaHTML}
                </div>
                ${descHTML}
                ${codigosHTML}
                ${htmlEmbedHTML}
              </div>
            </div>
            <div class="p-6 pt-0 space-y-2">
              ${bannerCodigoHTML}
              ${botonHTML}
            </div>
          `;

          container.appendChild(card);
        });

      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="col-span-full text-center p-6 bg-white rounded-xl shadow-sm text-red-500">Error al cargar las ventajas: ${err.message}</div>`;
      }
    }

    cargarVentajasPublicas();
  </script>
  <script async src="//www.instagram.com/embed.js"></script>
</body>
</html>
