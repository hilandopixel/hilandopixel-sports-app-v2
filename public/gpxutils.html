<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procesador de GPX y Waypoints por Kilómetros</title>
    <link rel="stylesheet" href="style2.css">

  <!-- Tailwind CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    /* Estilos específicos y seguros para la tabla */
    .gpx-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    .gpx-table th, .gpx-table td {
      border: 1px solid #e5e7eb;
      padding: 10px;
      text-align: left;
    }
    .gpx-table th {
      background-color: #f9fafb;
      font-weight: 600;
    }
    .map-btn {
      background-color: #4285F4;
      color: white;
      padding: 6px 12px;
      text-decoration: none;
      border-radius: 4px;
      font-size: 13px;
      display: inline-block;
      font-weight: 500;
    }
    .map-btn:hover {
      background-color: #3367D6;
    }

  </style>
  <script src="./navbar.js" defer></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <navbar-header></navbar-header>
  <div class="max-w-4xl mx-auto p-6 bg-white shadow-md rounded-lg my-10">
    <h2 class="text-2xl font-bold mb-6 text-primary">Procesador de Ficheros GPX (Kilómetros)</h2>
    
    <!-- Formulario -->
    <form id="gpxForm" class="space-y-4">
      <div>
        <label for="gpxFile" class="block font-semibold mb-1">Archivo GPX:</label>
        <input type="file" id="gpxFile" accept=".gpx" required class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
      </div>
      
      <div>
        <label for="intervalDist" class="block font-semibold mb-1">Distancia entre waypoints (kilómetros):</label>
        <input type="number" id="intervalDist" value="1" step="0.1" min="0" required class="w-full md:w-1/3 border border-gray-300 p-2 rounded-md focus:ring-2 focus:ring-indigo-500">
      </div>
      
      <button type="submit" class="btn-primary font-semibold px-5 py-2 rounded-md hover:bg-indigo-700 transition">Procesar y Visualizar</button>
    </form>

    <!-- Contenedor del Mapa con estilos en línea infalibles -->
    <div style="width: 100%; height: 450px; margin-top: 25px; border-radius: 8px; border: 1px solid #d1d5db; position: relative; overflow: hidden;">
      <div id="map" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1;"></div>
    </div>

    <!-- Botón de Descarga -->
    <div class="mt-6">
      <button id="downloadBtn" class="btn-primary">📥 Descargar GPX Modificado</button>
    </div>

    <!-- Tabla de Waypoints -->
    <h3 class="text-xl font-bold mt-8 mb-4">Tabla de Waypoints Generados</h3>
    <div class="overflow-x-auto">
      <table id="waypointsTable" class="gpx-table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Distancia Acumulada</th>
            <th>Latitud</th>
            <th>Longitud</th>
            <th>Google Maps</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="5" class="text-center text-gray-500">Sube un archivo GPX para ver los datos</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Inicializar el mapa de Leaflet
    const map = L.map('map').setView([40.4168, -3.7038], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let featureGroup = L.layerGroup().addTo(map);
    let generatedGpxString = null; 
    let outputFilename = 'ruta_con_waypoints_kms.gpx';

    document.getElementById('gpxForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const fileInput = document.getElementById('gpxFile');
      const intervalKm = parseFloat(document.getElementById('intervalDist').value);
      const distanceIntervalMeters = intervalKm * 1000;
      
      if (!fileInput.files.length) return;
      
      const file = fileInput.files[0];
      
      // Construir nombre dinámico sumando _kms
      const originalName = file.name;
      const lastDotIndex = originalName.lastIndexOf('.');
      if (lastDotIndex !== -1) {
        const baseName = originalName.substring(0, lastDotIndex);
        outputFilename = `${baseName}_kms.gpx`;
      } else {
        outputFilename = `${originalName}_kms.gpx`;
      }

      const reader = new FileReader();
      reader.onload = function(event) {
        const parser = new DOMParser();
        const gpxDoc = parser.parseFromString(event.target.result, "application/xml");
        processGpxAndRender(gpxDoc, distanceIntervalMeters);
      };
      reader.readAsText(file);
    });

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3; // Radio de la Tierra en metros
      const rad = Math.PI / 180;
      const dLat = (lat2 - lat1) * rad;
      const dLon = (lon2 - lon1) * rad;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * rad) * Math.cos(lat2 * rad) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function processGpxAndRender(gpxDoc, intervalMeters) {
      const trkpts = gpxDoc.getElementsByTagName('trkpt');
      if (!trkpts.length) {
        alert("El archivo GPX no contiene puntos de track (trkpt).");
        return;
      }
      
      featureGroup.clearLayers();
      
      let trackCoords = [];
      let accumulatedDistance = 0;
      let nextTargetDistance = intervalMeters;
      const newWaypoints = [];
      
      let prevLat = parseFloat(trkpts[0].getAttribute('lat'));
      let prevLon = parseFloat(trkpts[0].getAttribute('lon'));
      trackCoords.push([prevLat, prevLon]);
      
      for (let i = 1; i < trkpts.length; i++) {
        const currLat = parseFloat(trkpts[i].getAttribute('lat'));
        const currLon = parseFloat(trkpts[i].getAttribute('lon'));
        trackCoords.push([currLat, currLon]);
        
        const dist = calculateDistance(prevLat, prevLon, currLat, currLon);
        accumulatedDistance += dist;
        
        while (accumulatedDistance >= nextTargetDistance) {
          const kmLabel = (nextTargetDistance / 1000).toFixed(1);
          newWaypoints.push({ 
            lat: currLat, 
            lon: currLon, 
            name: `Km ${kmLabel}`, 
            distKm: kmLabel 
          });
          nextTargetDistance += intervalMeters;
        }
        
        prevLat = currLat;
        prevLon = currLon;
      }
      
      // Dibujar ruta en el mapa y ajustar límites
      const polyline = L.polyline(trackCoords, { color: 'blue', weight: 4 }).addTo(featureGroup);
      map.fitBounds(polyline.getBounds());
      
      // Forzar renderizado del mapa para prevenir pantallas en blanco
      setTimeout(() => {
        map.invalidateSize();
      }, 200);
      
      // Dibujar marcadores de waypoints
      newWaypoints.forEach(wp => {
        L.marker([wp.lat, wp.lon])
          .bindPopup(`<b>${wp.name}</b><br>Lat: ${wp.lat.toFixed(5)}<br>Lon: ${wp.lon.toFixed(5)}`)
          .addTo(featureGroup);
      });
      
      // Rellenar la tabla HTML
      const tableBody = document.querySelector('#waypointsTable tbody');
      tableBody.innerHTML = '';
      
      const downloadBtn = document.getElementById('downloadBtn');

      if (newWaypoints.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" class="text-center text-red-500 font-semibold">No se generaron waypoints (el intervalo es mayor que la longitud del track).</td></tr>`;
        downloadBtn.style.display = 'none';
        return;
      }
      
      newWaypoints.forEach(wp => {
        const row = document.createElement('tr');
        const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${wp.lat},${wp.lon}`;
        
        row.innerHTML = `
          <td class="font-medium">${wp.name}</td>
          <td>${wp.distKm} km</td>
          <td>${wp.lat.toFixed(6)}</td>
          <td>${wp.lon.toFixed(6)}</td>
          <td><a href="${mapsUrl}" target="_blank" class="btn-primary">🗺️ Abrir en Maps</a></td>
        `;
        tableBody.appendChild(row);
      });

      // Insertar los waypoints físicamente en el documento XML del GPX
      const gpxRoot = gpxDoc.documentElement;
      newWaypoints.forEach(wp => {
        const wptEl = gpxDoc.createElement('wpt');
        wptEl.setAttribute('lat', wp.lat);
        wptEl.setAttribute('lon', wp.lon);
        
        const nameEl = gpxDoc.createElement('name');
        nameEl.textContent = wp.name;
        wptEl.appendChild(nameEl);
        
        gpxRoot.insertBefore(wptEl, gpxRoot.firstChild);
      });

      // Serializar a texto y mostrar botón de descarga
      const serializer = new XMLSerializer();
      generatedGpxString = serializer.serializeToString(gpxDoc);
      downloadBtn.style.display = 'inline-block';
    }

    // Gestionar la descarga del archivo modificado
    document.getElementById('downloadBtn').addEventListener('click', function() {
      if (!generatedGpxString) return;
      
      const blob = new Blob([generatedGpxString], { type: 'application/gpx+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = outputFilename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>

</body>
</html>
