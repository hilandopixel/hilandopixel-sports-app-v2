<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="HilandoPixel">
<meta content="carrera, fotos, running, tusresulta2, hilandopixel, larompepiernas" name="keywords">
<meta content="Búsqueda de fotos y resultados de la Final Interprovincial Andaluza CxM Edad Escolar 2026" name="description">
<meta property="og:image" content="/final-interprovincial-cxm-escolar-andalucia-2026/previewWeb.png">
<meta property="og:title" content="Final Interprovincial Andaluza CxM Edad Escolar 2026 - TusResulta2 - Búsqueda de fotos" />
<meta property="og:description" content="Búsqueda de fotos y resultados de la Final Interprovincial Andaluza CxM Edad Escolar 2026" />
<title>Final Interprovincial Andaluza CxM Edad Escolar 2026 - HilandoPixel - TusResulta2 - Búsqueda de fotos</title>
<link rel="icon" href="/assets/favicon.ico">
<link rel="stylesheet" href="/assets/style.css">
    <link rel="stylesheet" href="/style.css">
    <script src="/navbar.js" defer></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#5b6672;--pri:#12355b;--acc:#f5a623;--ok:#2e7d32;--err:#b3261e;--bd:#d5dae1;--res:#e8f1fb}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--card:#1a222b;--tx:#eef2f6;--mut:#9aa7b4;--pri:#7fb2ee;--acc:#f5a623;--ok:#66bb6a;--err:#ef9a9a;--bd:#2d3945;--res:#22313f}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{background:var(--pri);color:#fff;padding:14px 16px}
@media (prefers-color-scheme:dark){header{color:#10151b}}
header h1{margin:0;font-size:clamp(18px,5vw,24px)}
header small{display:block;opacity:.85;font-size:14px;margin-top:2px}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 3px #0002}
label{display:block;font-weight:600;margin:10px 0 4px}
input,select{width:100%;font-size:18px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
#dorsal{font-size:20px;font-weight:600}
button{font-size:18px;padding:13px 18px;border:0;border-radius:10px;background:var(--pri);color:#fff;cursor:pointer;font-weight:600}
@media (prefers-color-scheme:dark){button{color:#10151b}}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.fila{display:flex;gap:10px;margin-top:12px}.fila button{flex:1}
details summary{cursor:pointer;font-weight:600}
.res .dor{font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.res .dnum{font-size:clamp(34px,11vw,52px);font-weight:800;color:var(--pri);line-height:1.1}
.res .nom{font-size:clamp(24px,7vw,34px);font-weight:700;margin-top:6px;word-break:break-word}
.res .ape{font-size:clamp(22px,6.5vw,30px);font-weight:600;word-break:break-word}
.res .cat{display:inline-block;margin-top:12px;padding:8px 14px;border-radius:999px;background:var(--acc);color:#1b1f24;font-weight:700;font-size:clamp(18px,5vw,22px)}
.res .cat.sin{background:var(--bd);color:var(--mut)}
.resultado{margin-top:16px;padding:14px;border-radius:12px;background:var(--res)}
.resultado .et{font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.resultado .tiempo{font-size:clamp(34px,11vw,52px);font-weight:800;font-variant-numeric:tabular-nums;color:var(--pri);line-height:1.15}
.resultado .pos{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.resultado .pos div{flex:1 1 120px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;text-align:center}
.resultado .pos b{display:block;font-size:clamp(22px,7vw,30px)}
.resultado .pos span{font-size:13px;color:var(--mut)}
.resultado .ritmo{margin-top:8px;color:var(--mut);font-size:16px}
.sinres{margin-top:14px;color:var(--mut);font-style:italic}
.msg{color:var(--mut)}.err{color:var(--err);font-weight:600}.ok{color:var(--ok)}
.vacio{font-style:italic;color:var(--mut)}
#est{font-size:14px;color:var(--mut);text-align:center;margin:14px 0}
article.card .et{font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.card.resultado{background:var(--res);margin-top:12px}
.tcat{max-height:60vh;overflow:auto;border:1px solid var(--bd);border-radius:10px;margin-top:8px}
.tcat table{width:100%;border-collapse:collapse}
.tcat th,.tcat td{padding:8px 10px;text-align:left;font-size:16px;border-bottom:1px solid var(--bd)}
.tcat th{position:sticky;top:0;background:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){.tcat th{color:#10151b}}
.tcat td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.tcat tr.yo td{background:var(--acc);color:#1b1f24;font-weight:700}
@media (max-width:440px){.hm{display:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<navbar-header></navbar-header>
<header><h1>Final Interprovincial Andaluza CxM Edad Escolar 2026</h1><small id="ev">Conectando…</small></header>
<main>
    <div>
        <a href="/" target="_blank"><img class="width-full" src="./previewWeb-hq.png" alt="Fotos y resultados de Final Interprovincial Andaluza CxM Edad Escolar 2026" /></a>
    </div>
<section id="busq" class="card" hidden>
 <label for="dorsal">Buscar participante por dorsal, nombre o apellido</label>
 <input id="dorsal" type="text" autocomplete="off" placeholder="Dorsal, nombre o apellidos">
 <div class="fila"><button id="buscar" type="button">Buscar</button><button id="limpiar" type="button" class="sec">Borrar</button></div>
</section>
<section id="res" aria-live="polite"></section>
<div id="est"></div>
</main>
<script>
// =========================================================================
// VARIABLES DE CONFIGURACIÓN INTERNA
// =========================================================================
const DB_URL = 'https://hilandopixel-crono-default-rtdb.europe-west1.firebasedatabase.app';
const EVENTO_ID = 'p8b9f2jjz77qw3'; // <-- Cambia esto por la clave o ID de tu evento
const REFRESCO = 30000;               // Refresco automático cada 30 segundos
// =========================================================================

const $ = id => document.getElementById(id);
let DATA = null, timer = null, SIG = '';

// Permite sobreescribir mediante parámetros URL ?db=... o ?evento=... si fuese necesario
const q = new URLSearchParams(location.search);
const db_activa = q.get('db') || DB_URL;
const cid = q.get('evento') || EVENTO_ID;

async function leer(p) {
  const r = await fetch(db_activa.replace(/\/+$/, '') + p + '.json');
  if (r.status == 401 || r.status == 403) throw new Error('Acceso denegado: comprueba las reglas públicas de tu Realtime Database.');
  if (!r.ok) throw new Error('Error ' + r.status + ' al leer los datos');
  return r.json();
}

const arr = v => Array.isArray(v) ? v.filter(Boolean) : (v && typeof v == 'object' ? Object.values(v) : []);
const eqD = (a, b) => a !== '' && a != null && b !== '' && b != null && +a === +b;
const fmt = ms => { let s = Math.floor(Math.max(0, ms) / 1000); return [s / 3600 | 0, (s / 60 | 0) % 60, s % 60].map(x => String(x).padStart(2, '0')).join(':'); };

function catFor(p) {
  const y = p.nac ? +String(p.nac).slice(0, 4) : 0;
  return (DATA.c.find(c => y && y >= +c.ini && y <= +c.fin && (c.sexo == 'X' || c.sexo == p.sexo))) || null;
}

function raceFor(c) {
  return c ? DATA.r.find(r => (r.cats || []).includes(c.id)) || null : null;
}

function calcular() {
  const mins = {};
  DATA.l.forEach(l => {
    if (l.prov) return;
    const o = mins[l.d];
    if (!o || l.ts < o.ts || (l.ts == o.ts && String(l.id) < String(o.id))) mins[l.d] = l;
  });
  const rows = [];
  Object.values(mins).forEach(l => {
    const p = DATA.p.find(x => eqD(x.dorsal, l.d));
    if (!p) return;
    const c = catFor(p), r = raceFor(c);
    if (!c || !r || !r.t0) return;
    rows.push({ l, p, c, r, ms: l.ts - r.t0 });
  });
  rows.sort((a, b) => a.ms - b.ms || String(a.l.id).localeCompare(String(b.l.id)));
  const rc = {}, cc = {}, out = {};
  rows.forEach(x => {
    x.pg = rc[x.r.id] = (rc[x.r.id] || 0) + 1;
    x.pc = cc[x.c.id] = (cc[x.c.id] || 0) + 1;
    out[x.p.id] = x;
  });
  DATA.rows = rows;
  return out;
}

const ritmo = x => {
  const d = +x.r.dist;
  if (!(d > 0)) return '';
  const q = Math.round(x.ms / 1000 / d);
  return Math.floor(q / 60) + ':' + String(q % 60).padStart(2, '0');
};

const norm = s => String(s || '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();

function buscarParticipante(txt) {
  const t = String(txt).trim();
  if (t === '') return null;
  const tNorm = norm(t);
  const esNumero = !isNaN(+t);
  const numDorsal = esNumero ? +t : null;

  return DATA.p.filter(p => {
    if (numDorsal !== null && eqD(p.dorsal, numDorsal)) return true;
    const nom = norm(p.nombre);
    const ape = norm(p.apellidos);
    const completo = norm((p.nombre || '') + ' ' + (p.apellidos || ''));
    return nom.includes(tNorm) || ape.includes(tNorm) || completo.includes(tNorm);
  }).map(p => ({
    dorsal: p.dorsal,
    nombre: (p.nombre || '').trim(),
    apellidos: (p.apellidos || '').trim(),
    cat: catFor(p),
    res: DATA.res[p.id] || null
  }));
}

function estado(t, cls) { const e = $('est'); e.textContent = t; e.className = cls || ''; }
function msg(t, cls) { const r = $('res'); r.innerHTML = ''; const d = document.createElement('div'); d.className = 'card ' + (cls || 'msg'); d.textContent = t; r.appendChild(d); }

function pintar(rs, txt) {
  const r = $('res');
  r.innerHTML = '';
  if (rs === null) return msg('Escribe un número de dorsal, nombre o apellidos.');
  if (!rs.length) return msg('No se encontraron participantes que coincidan con "' + String(txt).trim() + '".', 'err');
  
  const add = (p, c, t) => { const d = document.createElement('div'); d.className = c; d.textContent = t; p.appendChild(d); return d; };
  const card = cls => { const a = document.createElement('article'); a.className = 'card ' + cls; return a; };
  let foco = null;

  rs.forEach(x => {
    const a = card('res'); add(a, 'dor', 'Dorsal'); add(a, 'dnum', x.dorsal);
    if (!x.nombre && !x.apellidos) add(a, 'nom vacio', 'Sin datos todavía');
    else { add(a, 'nom', x.nombre || '—'); add(a, 'ape', x.apellidos || '—'); }
    add(a, 'cat' + (x.cat ? '' : ' sin'), x.cat ? x.cat.nombre : 'Sin categoría');
    r.appendChild(a);

    const b = card('resultado'); add(b, 'et', 'Su clasificación');
    if (x.res) {
      add(b, 'tiempo', fmt(x.res.ms));
      const pos = document.createElement('div'); pos.className = 'pos'; b.appendChild(pos);
      const chip = (v, l) => { const d = document.createElement('div'); pos.appendChild(d); const bb = document.createElement('b'); bb.textContent = v; d.appendChild(bb); const sp = document.createElement('span'); sp.textContent = l; d.appendChild(sp); };
      chip(x.res.pg + 'º', 'Posición general'); chip(x.res.pc + 'º' + (x.res.pc <= 3 ? ' 🏆' : ''), 'En su categoría');
      if (ritmo(x.res)) add(b, 'ritmo', 'Ritmo medio: ' + ritmo(x.res) + ' min/km');
    } else add(b, 'sinres', 'Todavía sin tiempo registrado');
    r.appendChild(b);

    if (x.cat) {
      const t = card(''); add(t, 'et', 'Clasificación completa · ' + x.cat.nombre);
      const rows = (DATA.rows || []).filter(q => q.c.id == x.cat.id);
      if (!rows.length) add(t, 'sinres', 'Todavía no hay resultados en esta categoría.');
      else {
        const box = document.createElement('div'); box.className = 'tcat'; const tb = document.createElement('table'); box.appendChild(tb);
        const hr = document.createElement('tr'); ['Pos', 'Dorsal', 'Nombre', 'Tiempo', 'Ritmo'].forEach((h, i) => { const th = document.createElement('th'); th.textContent = h; if (i == 4) th.className = 'hm'; hr.appendChild(th); }); tb.appendChild(hr);
        let yo = null;
        rows.forEach(q => {
          const tr = document.createElement('tr'); if (x.res && q.p.id == x.res.p.id) { tr.className = 'yo'; yo = tr; }
          const cell = (txt, cls) => { const td = document.createElement('td'); td.textContent = txt; if (cls) td.className = cls; tr.appendChild(td); };
          cell(q.pc + (q.pc <= 3 ? ' 🏆' : ''), 'n'); cell(q.p.dorsal, 'n'); cell(((q.p.nombre || '') + ' ' + (q.p.apellidos || '')).trim() || '—'); cell(fmt(q.ms), 'n'); cell(ritmo(q) || '-', 'n hm'); tb.appendChild(tr);
        });
        t.appendChild(box); if (yo) foco = { box, yo };
      }
      r.appendChild(t);
    }
  });

  if (rs.length > 1) { const n = document.createElement('p'); n.className = 'msg'; n.textContent = 'Atención: hay ' + rs.length + ' participantes que coinciden con la búsqueda.'; r.appendChild(n); }
  if (foco) foco.box.scrollTop = Math.max(0, foco.yo.offsetTop - foco.box.clientHeight / 2);
}

function buscar() {
  if (!DATA) return msg('Conectando a los datos...');
  const t = $('dorsal').value;
  pintar(buscarParticipante(t), t);
}

async function cargarDatos(silencio) {
  if (!cid) return estado('Error: No se ha indicado el ID del evento.', 'err');
  try {
    const base = '/eventos/' + cid + '/tablas/';
    const [p, c, r, l] = await Promise.all([leer(base + 'participantes'), leer(base + 'categorias'), leer(base + 'carreras'), leer(base + 'llegadas')]);
    const sg = JSON.stringify([p, c, r, l]), igual = !!silencio && !!DATA && sg === SIG; SIG = sg;
    if (!igual) {
      DATA = { p: arr(p), c: arr(c).sort((a, b) => (a.ini - b.ini) || (a.fin - b.fin) || String(a.sexo).localeCompare(String(b.sexo))), r: arr(r).sort((a, b) => (a.hora || '99:99').localeCompare(b.hora || '99:99')), l: arr(l) };
      DATA.res = calcular();
    }
    estado('Datos actualizados a las ' + new Date().toLocaleTimeString() + ' · ' + DATA.p.length + ' participantes · se actualiza cada ' + REFRESCO / 1000 + ' s', 'ok');
    $('busq').hidden = false;
    if (!silencio) { $('dorsal').focus(); }
    else if (!igual && $('dorsal').value.trim() !== '') {
      const sc = [...document.querySelectorAll('.tcat')].map(e => e.scrollTop); buscar();
      document.querySelectorAll('.tcat').forEach((e, i) => { if (sc[i] != null) e.scrollTop = sc[i]; });
    }
  } catch (e) {
    estado(e.message || String(e), 'err');
    if (!silencio) msg(e.message || String(e), 'err');
  }
}

async function obtenerNombreEvento() {
  try {
    const info = await leer('/indice/' + cid);
    if (info && info.nombre) $('ev').textContent = info.nombre;
    else $('ev').textContent = 'Evento: ' + cid;
  } catch (e) {
    $('ev').textContent = 'Evento: ' + cid;
  }
}

async function iniciar() {
  estado('Conectando…');
  await obtenerNombreEvento();
  await cargarDatos(false);
  if (!timer) timer = setInterval(() => { if (cid && DATA) cargarDatos(true); }, REFRESCO);
}

$('buscar').onclick = buscar;
$('limpiar').onclick = () => { $('dorsal').value = ''; $('res').innerHTML = ''; $('dorsal').focus(); };
$('dorsal').onkeydown = e => { if (e.key == 'Enter') { e.preventDefault(); buscar(); } };

// Iniciar aplicación
iniciar();
</script>
</body></html>
