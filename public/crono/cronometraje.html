<script>
const $=s=>document.querySelector(s);
const esc=x=>String(x??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
let IDX=[];try{IDX=JSON.parse(localStorage.getItem('crono_idx'))||[]}catch(e){}
let S=null,cur=null,FH=null,wt;
const idxSave=()=>{try{localStorage.setItem('crono_idx',JSON.stringify(IDX))}catch(e){}};
const newS=n=>({nombre:n,p:[],c:[],r:[],l:[],img:{h:'',f:''},t:n});
const pack=s=>({formato:'cronometraje',version:1,nombre:s.nombre,cid:s.cid,cfgM:s.cfgM||0,mod:s.mod||0,eliminadas:s.del||[],config:{titulo:s.t,img:s.img,col:s.col||null},tablas:{participantes:s.p,categorias:s.c,carreras:s.r,llegadas:s.l}});
const unpack=o=>{if(o&&(o.tablas||o.formato=='cronometraje')){const t=o.tablas||{},c=o.config||{};return{nombre:o.nombre||'Evento',t:c.titulo||o.nombre||'Resultados',img:c.img||{h:'',f:''},col:c.col||null,p:(t.participantes||[]).map(fixP),c:t.categorias||[],r:(t.carreras||[]).map(x=>({...x,cats:x.cats||[],t0:x.t0||null})),l:t.llegadas||[],del:o.eliminadas||[],cfgM:o.cfgM||0,mod:o.mod||0,...(o.cid?{cid:o.cid}:{})}}
 if(o&&Array.isArray(o.p))return{nombre:o.nombre||'Evento importado',t:o.t||'Resultados',img:o.img||{h:'',f:''},col:o.col||null,p:o.p.map(fixP),c:o.c||[],r:o.r||[],l:o.l||[]};throw new Error('formato de datos no válido')};
let cfg={},TOKEN='';try{cfg=JSON.parse(localStorage.getItem('crono_fb'))||{}}catch(e){}
if('auth' in cfg){delete cfg.auth;try{localStorage.setItem('crono_fb',JSON.stringify(cfg))}catch(e){}}
let lastKnown=0,st,syncing=false,pend=false,syncMsg='';
const save=()=>{if(!cur)return;S.mod=Date.now();stamp();persist();if(cfg.auto&&cfg.url&&S.cid){clearTimeout(st);st=setTimeout(()=>sync(true),1500)}};
const persist=()=>{if(!cur)return;try{localStorage.setItem('crono_ev_'+cur,JSON.stringify(S));const ev=IDX.find(x=>x.id==cur);if(ev){ev.mod=Date.now();ev.nombre=S.nombre;ev.cid=S.cid;idxSave()}}catch(e){toast('No se pudo guardar en el navegador (¿imagen muy grande?)')}
 if(FH){clearTimeout(wt);wt=setTimeout(async()=>{try{const w=await FH.createWritable();await w.write(JSON.stringify(pack(S),null,1));await w.close()}catch(e){toast('No se pudo escribir en el fichero vinculado');FH=null}},500)}};
function toast(t){const e=document.createElement('div');e.textContent=t;e.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:8px;z-index:9;max-width:90%';document.body.append(e);setTimeout(()=>e.remove(),3500)}
function ask(t){return new Promise(ok=>{const d=document.createElement('div');d.className='modal';d.style.cssText='position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:9';d.innerHTML='<div class="card" style="max-width:340px">'+t+'<br><br><button class="b" id="y">Aceptar</button><button class="b r" id="n">Cancelar</button></div>';document.body.append(d);d.onpointerdown=e=>{if(e.target===d){d.remove();focoMeta();ok(false)}};d.querySelector('#y').onclick=()=>{d.remove();focoMeta();ok(true)};d.querySelector('#n').onclick=()=>{d.remove();focoMeta();ok(false)}})}
const uid=()=>Math.random().toString(36).slice(2,9);
const fmt=ms=>{let s=Math.floor(Math.max(0,ms)/1000);return[s/3600|0,(s/60|0)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':')};
const yr=p=>p.nac?+String(p.nac).slice(0,4):0;
const catOf=p=>S.c.find(c=>yr(p)>=c.ini&&yr(p)<=c.fin&&(c.sexo=='X'||c.sexo==p.sexo));
const raceOf=c=>c&&S.r.find(r=>r.cats.includes(c.id));
const T={
 p:{n:'Participantes',cols:[['dorsal','Dorsal','number'],['nombre','Nombre'],['apellidos','Apellidos'],['club','Club'],['nac','F. nacimiento','date'],['sexo','Sexo',['M','F']],['fed','Federado','chk'],['loc','Local','chk'],['salio','Ha salido','chk']],nuevo:()=>({id:uid(),dorsal:'',nombre:'',apellidos:'',club:'',nac:'',sexo:'M',fed:false,loc:false,salio:false})},
 c:{n:'Categorías',cols:[['nombre','Nombre'],['ini','Año inicio','number'],['fin','Año fin','number'],['sexo','Sexo (X = mixto)',['M','F','X']]],nuevo:()=>({id:uid(),nombre:'Nueva',ini:2000,fin:2010,sexo:'M'})},
 r:{n:'Carreras',cols:[['nombre','Nombre'],['hora','Hora inicio prevista','time']],nuevo:()=>({id:uid(),nombre:'Nueva carrera',hora:'',cats:[],t0:null})}
};
let tab='p';
const tabs={p:'Participantes',c:'Categorías',r:'Carreras',s:'Control salida',m:'Meta / Cronómetro',k:'Clasificación',d:'Datos'};
let RTOK='',TEXP=0,CRED={};try{CRED=JSON.parse(sessionStorage.getItem('crono_cred'))||{}}catch(e){}
function credStore(){try{CRED.email||CRED.pass?sessionStorage.setItem('crono_cred',JSON.stringify(CRED)):sessionStorage.removeItem('crono_cred')}catch(e){}}
function cfgOut(){CRED={};TOKEN='';RTOK='';TEXP=0;credStore();view()}
const AE={EMAIL_NOT_FOUND:'usuario no encontrado',INVALID_PASSWORD:'contraseña incorrecta',INVALID_LOGIN_CREDENTIALS:'usuario o contraseña incorrectos',OPERATION_NOT_ALLOWED:'activa Email/Password en Firebase Authentication',USER_DISABLED:'usuario deshabilitado',TOO_MANY_ATTEMPTS_TRY_LATER:'demasiados intentos, espera un poco'};
const herr=r=>{if(r.status==401||r.status==403)TEXP=0;return new Error(r.status==401||r.status==403?'acceso denegado: conecta con usuario y contraseña (página de eventos)':'HTTP '+r.status)};
async function authReq(u,o){const r=await fetch(u,o),j=await r.json();if(!r.ok){const m=String((j.error&&j.error.message)||r.status);throw new Error(AE[m.split(' ')[0]]||m)}return j}
async function login(){if(!cfg.key||!CRED.email)return;
 const j=await authReq('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+encodeURIComponent(cfg.key),{method:'POST',body:JSON.stringify({email:CRED.email,password:CRED.pass,returnSecureToken:true})});
 TOKEN=j.idToken;RTOK=j.refreshToken;TEXP=Date.now()+(+j.expiresIn-120)*1000}
async function tok(){if(!cfg.key||(TOKEN&&Date.now()<TEXP))return;
 if(RTOK)try{const j=await authReq('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(cfg.key),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(RTOK)});TOKEN=j.id_token;RTOK=j.refresh_token;TEXP=Date.now()+(+j.expires_in-120)*1000;return}catch(e){}
 await login()}
const fb=p=>cfg.url.replace(/\/+$/,'')+p+'.json'+(TOKEN?'?auth='+encodeURIComponent(TOKEN):'');
const cfgHtml=()=>`<div class="card"><b>Firebase (Realtime Database)</b> · sincronización entre dispositivos<br>URL de la base de datos:<br><input id="fu" style="width:95%" placeholder="https://tu-proyecto-default-rtdb.europe-west1.firebasedatabase.app" value="${esc(cfg.url)}"><br>Web API Key del proyecto (para el acceso con usuario):<br><input id="fk" style="width:95%" value="${esc(cfg.key)}"><br>Usuario (email) · se guarda solo en la sesión de este navegador:<br><input id="fe" type="email" autocomplete="off" style="width:95%" value="${esc(CRED.email)}"><br>Contraseña · se guarda solo en la sesión de este navegador (se borra al cerrar la pestaña):<br><input id="fa" type="password" autocomplete="off" style="width:95%" value="${esc(CRED.pass)}"><br><button class="b" onclick="cfgSave()">Guardar y conectar</button><button class="b" onclick="nube()">Ver eventos en la nube</button><button class="b" onclick="cfgOut()">Olvidar usuario</button> ${TOKEN?'🔒 conectado':''}<div id="nb"></div></div>`;
function cfgStore(){try{localStorage.setItem('crono_fb',JSON.stringify(cfg))}catch(e){}}
async function cfgSave(){cfg.url=$('#fu').value.trim();cfg.key=$('#fk').value.trim();CRED={email:$('#fe').value.trim(),pass:$('#fa').value};TOKEN='';RTOK='';TEXP=0;cfgStore();credStore();
 if(cfg.key&&CRED.email){try{await login();toast('Conectado');view()}catch(e){toast('No se pudo conectar: '+e.message)}}else toast('Configuración guardada')}
function cfgAuto(v){cfg.auto=v;cfgStore();setMsg(syncMsg||'automática '+(v?'activada':'desactivada'));if(v)sync()}
function setMsg(m,err){syncMsg=m;const a=$('#sy');if(a)a.textContent=m;let b=$('#cl');if(!b){b=document.createElement('div');b.id='cl';b.className='np';b.style.cssText='position:fixed;bottom:6px;right:8px;font-size:12px;padding:3px 8px;border-radius:10px;color:#fff;z-index:5';document.body.append(b)}b.style.display=cfg.auto&&cur?'block':'none';b.style.background=err?'#b3261e':'#2e7d32';b.textContent=(err?'☁ ✕ ':'☁ ✓ ')+m}
function refresh(){const a=document.activeElement,busy=a&&(a.tagName=='INPUT'||a.tagName=='SELECT')&&a.closest&&a.closest('#v')&&((a.id!='dor'&&a.id!='sal')||a.value);if(busy){pend=true;return}pend=false;view()}
let snap={},cfgSnap='',noET=false;
const rk=x=>{const{_m,...o}=x;return JSON.stringify(o)};
function stamp(init){const now=Date.now();['p','c','r','l'].forEach(t=>(S[t]||[]).forEach(x=>{if(!x.id)return;const k=rk(x);if(snap[x.id]!==k){snap[x.id]=k;if(!init)x._m=now}}));
 const ck=JSON.stringify([S.nombre,S.t,S.img,S.col]);if(ck!==cfgSnap){cfgSnap=ck;if(!init)S.cfgM=now}}
const fixP=p=>p.id?p:{...p,id:p.dorsal?'d'+p.dorsal:uid()};
function mergeT(a,b,del){const m=new Map();[...a,...b].forEach(x=>{if(!x.id||del.has(x.id))return;const o=m.get(x.id);if(!o||(x._m||0)>(o._m||0)||((x._m||0)==(o._m||0)&&JSON.stringify(x)>JSON.stringify(o)))m.set(x.id,x)});return[...m.values()]}
function dedup(p,del){const g={};p.forEach(x=>{const nm=(x.nombre+' '+x.apellidos).trim().toLowerCase();if(x.dorsal===''||x.dorsal==null||!nm)return;const k=x.dorsal+'|'+nm,o=g[k];if(!o){g[k]=x;return}const w=((x._m||0)>(o._m||0)||((x._m||0)==(o._m||0)&&x.id>o.id))?x:o;g[k]=w;del.add((w===x?o:x).id)});return p.filter(x=>!del.has(x.id))}
const fp=x=>JSON.stringify([['p','c','r','l'].map(t=>(x[t]||[]).map(a=>a.id+':'+(a._m||0)).sort()),(x.del||[]).slice().sort(),x.cfgM||0]);
async function fx(u,o,h){if(!noET)try{return await fetch(u,{...o,headers:h})}catch(e){noET=true}return fetch(u,o)}
async function sync(quiet){
 if(!cur||!cfg.url){if(!quiet)toast('Configura Firebase en la página de eventos');return}
 if(syncing)return;syncing=true;
 try{
  await tok();
  if(!S.cid){S.cid=uid()+uid();persist()}
  const U=fb('/eventos/'+S.cid);
  if(quiet&&lastKnown){const x=await fetch(fb('/indice/'+S.cid));if(x.ok){const ix=await x.json();if(ix&&ix.mod===lastKnown&&S.mod===lastKnown){setMsg('al día '+new Date().toLocaleTimeString());return}}}
  const b0=fp(S);let ok=false;
  for(let n=0;n<4&&!ok;n++){
   const r=await fx(U,{},{'X-Firebase-ETag':'true'});if(!r.ok)throw herr(r);
   const et=r.headers.get('ETag'),R=await r.json();let up=true;
   if(R){const d=unpack(R),del=new Set([...(S.del||[]),...(d.del||[])]);
    S.p=dedup(mergeT(S.p,d.p,del),del);S.c=mergeT(S.c,d.c,del);S.r=mergeT(S.r,d.r,del);S.l=mergeT(S.l,d.l,del).sort((x,y)=>x.ts-y.ts);S.del=[...del];
    if((d.cfgM||0)>(S.cfgM||0)){S.nombre=d.nombre;S.t=d.t;S.img=d.img;S.col=d.col||null;S.cfgM=d.cfgM}
    up=fp(S)!==fp(d);if(!up)S.mod=d.mod}
   if(up)S.mod=Date.now();
   snap={};cfgSnap='';stamp(1);persist();
   if(up){const w=await fx(U,{method:'PUT',body:JSON.stringify(pack(S))},et?{'if-match':et}:{});if(w.status==412)continue;if(!w.ok)throw herr(w);
    await fetch(fb('/indice/'+S.cid),{method:'PUT',body:JSON.stringify({nombre:S.nombre,mod:S.mod})})}
   ok=true}
  if(!ok)throw new Error('conflicto con otro dispositivo, se reintentará');
  lastKnown=S.mod;setMsg('sincronizado '+new Date().toLocaleTimeString());
  const ch=b0!==fp(S);
  if(ch){const dd={};S.p.forEach(x=>{if(x.dorsal!=='')dd[x.dorsal]=(dd[x.dorsal]||0)+1});if(Object.values(dd).some(n=>n>1))toast('Hay dorsales duplicados tras sincronizar: revisa las filas en rojo');refresh()}
  else if(!quiet)toast('Sincronizado')
 }catch(e){setMsg('error: '+(e.message||e),1);if(!quiet)toast('Error de sincronización: '+(e.message||e))}
 finally{syncing=false}}
async function nube(){if(!cfg.url)return toast('Escribe la URL y pulsa Guardar');
 try{await tok();const r=await fetch(fb('/indice'));if(!r.ok)throw herr(r);const I=(await r.json())||{},k=Object.keys(I);
  $('#nb').innerHTML=k.length?'<table>'+k.map(c=>`<tr><td>${esc(I[c].nombre)}<td>${new Date(I[c].mod).toLocaleString()}<td><button class="b" onclick="bajar('${c}')">Descargar a este dispositivo</button></tr>`).join('')+'</table>':'<i>No hay eventos en la nube</i>'}catch(e){toast('Error: '+e.message)}}
async function bajar(c){if(IDX.find(x=>x.cid==c))return toast('Ya está en este dispositivo: ábrelo y pulsa Sincronizar');
 try{await tok();const r=await fetch(fb('/eventos/'+c));if(!r.ok)throw herr(r);const d=unpack(await r.json());d.cid=c;nuevoEv(d);toast('Evento descargado');view()}catch(e){toast('Error: '+e.message)}}
setInterval(()=>{if(cur&&cfg.auto&&cfg.url&&S.cid){if(pend)refresh();sync(true)}},8000);
let F={p:{},c:{},r:{},m:{},k:{}},dupF=false;
const EXACT={p:['sexo','fed','loc','salio'],c:['sexo'],m:['dup','sx']};
const iso2=n=>{const m=String(n||'').match(/^(\d{4})-(\d\d)-(\d\d)/);return m?m[3]+'/'+m[2]+'/'+m[1]:''};
function fmatch(t,vals){return Object.entries(F[t]).every(([k,f])=>{if(!f||!(k in vals))return true;const v=String(vals[k]??'').toLowerCase(),g=String(f).toLowerCase();return(EXACT[t]||[]).includes(k)?v===g:v.includes(g)})}
function fv(t,x){if(t=='p')return{dorsal:x.dorsal,nombre:x.nombre,apellidos:x.apellidos,club:x.club,nac:iso2(x.nac)||'sin fecha',sexo:x.sexo||'Vacío',fed:x.fed?'Sí':'No',loc:x.loc?'Sí':'No',salio:x.salio?'Sí':'No',anyo:yr(x)||'',cat:catOf(x)?.nombre||'sin categoría'};
 if(t=='c')return{nombre:x.nombre,ini:x.ini,fin:x.fin,sexo:x.sexo};
 return{nombre:x.nombre,hora:x.hora,hreal:x.t0?new Date(x.t0).toLocaleTimeString():'sin salida',cats:x.cats.map(id=>{const c=S.c.find(y=>y.id==id);return c?c.nombre+' '+c.sexo:''}).join(' ')}}
function fcell(t,k,opts){const v=F[t][k]||'',id='f_'+t+'_'+k;
 if(opts)return`<th><select id="${id}" onchange="fset('${t}','${k}',this.value)"><option value="">Todos</option>${opts.map(o=>{const[a,b]=Array.isArray(o)?o:[o,o];return`<option value="${esc(a)}" ${a==v?'selected':''}>${esc(b)}</option>`}).join('')}</select>`;
 return`<th><input id="${id}" placeholder="filtrar" style="width:100%;min-width:60px" value="${esc(v)}" oninput="fset('${t}','${k}',this.value,'${id}')">`}
function fset(t,k,v,id){if(t=='m'&&k=='d'&&id)dupF=false;F[t][k]=v;if(SEL[t])SEL[t].clear();view();if(id){const e=document.getElementById(id);if(e){e.focus();try{e.setSelectionRange(v.length,v.length)}catch(_){}}}}
function fclr(t){if(t=='m')dupF=false;F[t]={};if(SEL[t])SEL[t].clear();view()}
const SEL={p:new Set(),c:new Set(),r:new Set(),m:new Set()};
function selUpd(t){const b=$('#bs_'+t);if(b)b.textContent='🗑 Borrar seleccionados ('+SEL[t].size+')'}
function selOne(t,id,v){v?SEL[t].add(id):SEL[t].delete(id);selUpd(t)}
function selAll(t,v){document.querySelectorAll('.sel_'+t).forEach(e=>{e.checked=v;v?SEL[t].add(e.dataset.id):SEL[t].delete(e.dataset.id)});selUpd(t)}
function askCode(t){return new Promise(ok=>{const code=Array.from({length:5},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');const d=document.createElement('div');d.className='modal';d.style.cssText='position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:9';
 d.innerHTML='<div class="card" style="max-width:360px">'+t+'<br><br>Escribe <b style="font:bold 22px monospace;letter-spacing:3px">'+code+'</b> para confirmar:<br><input id="cc" autocomplete="off" style="font-size:20px;width:90%;text-transform:uppercase"><br><br><button class="b r" id="y" disabled>Borrar</button><button class="b" id="n">Cancelar</button></div>';
 document.body.append(d);d.onpointerdown=e=>{if(e.target===d){d.remove();focoMeta();ok(false)}};const i=d.querySelector('#cc'),y=d.querySelector('#y');i.oninput=()=>{y.disabled=i.value.trim().toUpperCase()!==code};i.onkeydown=e=>{if(e.key=='Enter'&&!y.disabled)y.click()};y.onclick=()=>{d.remove();focoMeta();ok(true)};d.querySelector('#n').onclick=()=>{d.remove();focoMeta();ok(false)};i.focus()})}
async function borrarSel(t){const arr=t=='m'?'l':t,ids=[...SEL[t]].filter(id=>S[arr].some(x=>x.id==id));if(!ids.length)return toast('Selecciona primero los registros que quieres borrar');
 const nm={p:'participantes',c:'categorías',r:'carreras',m:'llegadas'}[t];
 if(!(await askCode('Vas a borrar <b>'+ids.length+' '+nm+'</b>. No se puede deshacer'+(cfg.url?' y, si usas sincronización, también se borrarán en los demás dispositivos':'')+'.')))return;
 const set=new Set(ids);S.del=[...new Set([...(S.del||[]),...ids])];S[arr]=S[arr].filter(x=>!set.has(x.id));SEL[t].clear();save();view();toast(ids.length+' registros borrados')}
const slug=n=>(n||'evento').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w]+/g,'_').replace(/^_|_$/g,'')||'evento';
function dl(n,o){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));a.download=slug(n)+'.json';a.click()}
const load=id=>JSON.parse(localStorage.getItem('crono_ev_'+id));
function nuevoEv(d){const id=uid();localStorage.setItem('crono_ev_'+id,JSON.stringify(d));IDX.push({id,nombre:d.nombre,mod:Date.now(),cid:d.cid});idxSave();return id}

 const rc={},cc={};rows.forEach(x=>{x.pg=rc[x.r.id]=(rc[x.r.id]||0)+1;x.pc=cc[x.c.id]=(cc[x.c.id]||0)+1;pos[x.l.id]=x});

 rows.forEach(o=>{const g={};for(const k in o)g[k.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f\s_.]/g,'')]=o[k];

<p><b>Llegadas de meta</b> · dorsal y tiempo (hh:mm:ss desde la salida de su carrera) o hora (hora del día); provisional (opcional)<br><input type=file accept=".xlsx,.xls,.csv" onchange="impX('l',this.files[0]);this.value=''"></p></div>
<div class="card"><b>Fichero del evento (.json)</b><br>Contiene todas las tablas. Úsalo para llevar el evento a otro dispositivo, subirlo a la nube o archivarlo.<br><button class="b" onclick="bak()">Descargar evento</button> Cargar desde fichero: <input type=file accept=".json" onchange="rest(this.files[0]);this.value=''"><br>${FH?'Vinculado a <b>'+esc(FH.name)+'</b> (se guarda solo con cada cambio) <button class="b" onclick="FH=null;view()">Desvincular</button>':window.showSaveFilePicker?'<button class="b" onclick="vinc()">Vincular fichero (guardado automático)</button>':'<i>Tu navegador no permite vincular ficheros; usa Descargar evento.</i>'}</div>
<div class="card"><b>Sincronización con la nube</b><br>${cfg.url?`<button class="b" onclick="sync()">⇅ Sincronizar ahora</button> <label><input type=checkbox ${cfg.auto?'checked':''} onchange="cfgAuto(this.checked)"> Automática (cada pocos segundos)</label><div id="sy">${esc(syncMsg)}</div>`:'Configura Firebase en la página de eventos (botón ⌂ Eventos).'}</div>
<div class="card"><button class="b r" onclick="askCode('Vas a borrar <b>todas las llegadas y las salidas</b>. No se puede deshacer.').then(y=>{if(y){(S.del=S.del||[]).push(...S.l.map(x=>x.id));S.l=[];S.p.forEach(p=>{p.salio=false;delete p.tsal});S.r.forEach(r=>r.t0=null);save();view()}})">Reiniciar llegadas y salidas</button></div>`}
function ordenar(){S.c.sort((a,b)=>(a.ini-b.ini)||(a.fin-b.fin)||String(a.sexo).localeCompare(b.sexo));S.r.sort((a,b)=>(a.hora||'99:99').localeCompare(b.hora||'99:99'))}
function view(){nav();if(!cur){$('#v').innerHTML=vHome();return}ordenar();$('#v').innerHTML=tab=='m'?vMeta():tab=='s'?vS():tab=='k'?vK():tab=='d'?vD():tabla(tab);if(tab=='m')$('#dor')?.focus();if(tab=='s')$('#sal')?.focus()}
document.addEventListener('click',e=>{if(!cur||tab!='m'||document.querySelector('.modal'))return;if(e.target.closest&&e.target.closest('input,select,textarea,button,a'))return;setTimeout(()=>{if(document.querySelector('.modal')||!cur||tab!='m')return;const a=document.activeElement;if(!a||a===document.body||!/INPUT|SELECT|TEXTAREA/.test(a.tagName))focoMeta()},0)});
document.addEventListener('click',e=>{if(!dupF)return;const t=e.target;if(t&&t.closest&&t.closest('.dupb,#mt,.modal'))return;dupF=false;if(F.m.d){F.m.d='';if(tab=='m'&&cur)view()}});
migrar();view();if(cfg.key&&CRED.email)login().then(()=>view()).catch(()=>{});
