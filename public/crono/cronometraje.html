<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cronometraje de carreras</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f4f5f7;color:#222}
nav{display:flex;flex-wrap:wrap;gap:4px;background:#12355b;padding:8px;position:sticky;top:0}
nav button{background:#2a5a8f;color:#fff;border:0;padding:10px 14px;border-radius:6px;font-size:15px;cursor:pointer}
nav button.on{background:#f5a623;color:#000}
main{padding:12px;max-width:1100px;margin:auto}
table{border-collapse:collapse;width:100%;background:#fff;margin:8px 0}
th,td{border:1px solid #ccd;padding:4px 6px;text-align:left}
th{background:#e6ebf2}
input,select{font-size:14px;padding:4px;max-width:100%;box-sizing:border-box}
td input[type=text],td input:not([type]){width:100%}
td input[type=number]{width:80px}
button.b{padding:8px 12px;border:0;border-radius:6px;background:#12355b;color:#fff;cursor:pointer;margin:2px}
button.r{background:#b3261e}
.card{background:#fff;border-radius:8px;padding:12px;margin:10px 0;box-shadow:0 1px 3px #0003}
.clk{font:bold 44px monospace}
#dor{font-size:30px;width:160px}
.sc{overflow-x:auto}
@media print{nav,.np{display:none}body{background:#fff}}
</style></head><body>
<nav id="nav"></nav><main id="v"></main>
<script>
const $=s=>document.querySelector(s);
const esc=x=>String(x??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
let IDX=[];try{IDX=JSON.parse(localStorage.getItem('crono_idx'))||[]}catch(e){}
let S=null,cur=null,FH=null,wt;
const idxSave=()=>{try{localStorage.setItem('crono_idx',JSON.stringify(IDX))}catch(e){}};
const newS=n=>({nombre:n,p:[],c:[],r:[],l:[],img:{h:'',f:''},t:n});
const pack=s=>({formato:'cronometraje',version:1,nombre:s.nombre,cid:s.cid,cfgM:s.cfgM||0,mod:s.mod||0,eliminadas:s.del||[],config:{titulo:s.t,img:s.img},tablas:{participantes:s.p,categorias:s.c,carreras:s.r,llegadas:s.l}});
const unpack=o=>{if(o&&(o.tablas||o.formato=='cronometraje')){const t=o.tablas||{},c=o.config||{};return{nombre:o.nombre||'Evento',t:c.titulo||o.nombre||'Resultados',img:c.img||{h:'',f:''},p:(t.participantes||[]).map(fixP),c:t.categorias||[],r:(t.carreras||[]).map(x=>({...x,cats:x.cats||[],t0:x.t0||null})),l:t.llegadas||[],del:o.eliminadas||[],cfgM:o.cfgM||0,mod:o.mod||0,...(o.cid?{cid:o.cid}:{})}}
 if(o&&Array.isArray(o.p))return{nombre:o.nombre||'Evento importado',t:o.t||'Resultados',img:o.img||{h:'',f:''},p:o.p.map(fixP),c:o.c||[],r:o.r||[],l:o.l||[]};throw new Error('formato de datos no válido')};
let cfg={},TOKEN='';try{cfg=JSON.parse(localStorage.getItem('crono_fb'))||{}}catch(e){}
if('auth' in cfg){delete cfg.auth;try{localStorage.setItem('crono_fb',JSON.stringify(cfg))}catch(e){}}
let lastKnown=0,st,syncing=false,pend=false,syncMsg='';
const save=()=>{if(!cur)return;S.mod=Date.now();stamp();persist();if(cfg.auto&&cfg.url&&S.cid){clearTimeout(st);st=setTimeout(()=>sync(true),1500)}};
const persist=()=>{if(!cur)return;try{localStorage.setItem('crono_ev_'+cur,JSON.stringify(S));const ev=IDX.find(x=>x.id==cur);if(ev){ev.mod=Date.now();ev.nombre=S.nombre;ev.cid=S.cid;idxSave()}}catch(e){toast('No se pudo guardar en el navegador (¿imagen muy grande?)')}
 if(FH){clearTimeout(wt);wt=setTimeout(async()=>{try{const w=await FH.createWritable();await w.write(JSON.stringify(pack(S),null,1));await w.close()}catch(e){toast('No se pudo escribir en el fichero vinculado');FH=null}},500)}};
function toast(t){const e=document.createElement('div');e.textContent=t;e.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:8px;z-index:9;max-width:90%';document.body.append(e);setTimeout(()=>e.remove(),3500)}
function ask(t){return new Promise(ok=>{const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:9';d.innerHTML='<div class="card" style="max-width:340px">'+t+'<br><br><button class="b" id="y">Aceptar</button><button class="b r" id="n">Cancelar</button></div>';document.body.append(d);d.querySelector('#y').onclick=()=>{d.remove();ok(true)};d.querySelector('#n').onclick=()=>{d.remove();ok(false)}})}
const uid=()=>Math.random().toString(36).slice(2,9);
const fmt=ms=>{let s=Math.floor(Math.max(0,ms)/1000);return[s/3600|0,(s/60|0)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':')};
const yr=p=>p.nac?+String(p.nac).slice(0,4):0;
const catOf=p=>S.c.find(c=>yr(p)>=c.ini&&yr(p)<=c.fin&&(c.sexo=='X'||c.sexo==p.sexo));
const raceOf=c=>c&&S.r.find(r=>r.cats.includes(c.id));
const T={
 p:{n:'Participantes',cols:[['dorsal','Dorsal','number'],['nombre','Nombre'],['apellidos','Apellidos'],['club','Club'],['nac','F. nacimiento','date'],['sexo','Sexo',['M','F']],['fed','Federado','chk'],['loc','Local','chk'],['salio','Ha salido','chk']],nuevo:()=>({id:uid(),dorsal:'',nombre:'',apellidos:'',club:'',nac:'',sexo:'M',fed:false,loc:false,salio:false})},
 c:{n:'Categorías',cols:[['nombre','Nombre'],['ini','Año inicio','number'],['fin','Año fin','number'],['sexo','Sexo (X = mixto)',['M','F','X']]],nuevo:()=>({id:uid(),nombre:'Nueva',ini:2000,fin:2010,sexo:'M'})},
 r:{n:'Carreras',cols:[['nombre','Nombre'],['hora','Hora inicio prevista','time']],nuevo:()=>({id:uid(),nombre:'Nueva carrera',hora:'',cats:[],t0:null})}
};
let tab='p';
const tabs={p:'Participantes',c:'Categorías',r:'Carreras',s:'Control salida',m:'Meta / Cronómetro',k:'Clasificación',d:'Datos'};
let RTOK='',TEXP=0,CRED={};
const AE={EMAIL_NOT_FOUND:'usuario no encontrado',INVALID_PASSWORD:'contraseña incorrecta',INVALID_LOGIN_CREDENTIALS:'usuario o contraseña incorrectos',OPERATION_NOT_ALLOWED:'activa Email/Password en Firebase Authentication',USER_DISABLED:'usuario deshabilitado',TOO_MANY_ATTEMPTS_TRY_LATER:'demasiados intentos, espera un poco'};
const herr=r=>{if(r.status==401||r.status==403)TEXP=0;return new Error(r.status==401||r.status==403?'acceso denegado: conecta con usuario y contraseña (página de eventos)':'HTTP '+r.status)};
async function authReq(u,o){const r=await fetch(u,o),j=await r.json();if(!r.ok){const m=String((j.error&&j.error.message)||r.status);throw new Error(AE[m.split(' ')[0]]||m)}return j}
async function login(){if(!cfg.key||!CRED.email)return;
 const j=await authReq('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+encodeURIComponent(cfg.key),{method:'POST',body:JSON.stringify({email:CRED.email,password:CRED.pass,returnSecureToken:true})});
 TOKEN=j.idToken;RTOK=j.refreshToken;TEXP=Date.now()+(+j.expiresIn-120)*1000}
async function tok(){if(!cfg.key||(TOKEN&&Date.now()<TEXP))return;
 if(RTOK)try{const j=await authReq('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(cfg.key),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(RTOK)});TOKEN=j.id_token;RTOK=j.refresh_token;TEXP=Date.now()+(+j.expires_in-120)*1000;return}catch(e){}
 await login()}
const fb=p=>cfg.url.replace(/\/+$/,'')+p+'.json'+(TOKEN?'?auth='+encodeURIComponent(TOKEN):'');
const cfgHtml=()=>`<div class="card"><b>Firebase (Realtime Database)</b> · sincronización entre dispositivos<br>URL de la base de datos:<br><input id="fu" style="width:95%" placeholder="https://tu-proyecto-default-rtdb.europe-west1.firebasedatabase.app" value="${esc(cfg.url)}"><br>Web API Key del proyecto (para el acceso con usuario):<br><input id="fk" style="width:95%" value="${esc(cfg.key)}"><br>Usuario (email) · solo en esta sesión:<br><input id="fe" type="email" autocomplete="off" style="width:95%" value="${esc(CRED.email)}"><br>Contraseña · solo en esta sesión, nunca se guarda:<br><input id="fa" type="password" autocomplete="off" style="width:95%" value="${esc(CRED.pass)}"><br><button class="b" onclick="cfgSave()">Guardar y conectar</button><button class="b" onclick="nube()">Ver eventos en la nube</button> ${TOKEN?'🔒 conectado':''}<div id="nb"></div></div>`;
function cfgStore(){try{localStorage.setItem('crono_fb',JSON.stringify(cfg))}catch(e){}}
async function cfgSave(){cfg.url=$('#fu').value.trim();cfg.key=$('#fk').value.trim();CRED={email:$('#fe').value.trim(),pass:$('#fa').value};TOKEN='';RTOK='';TEXP=0;cfgStore();
 if(cfg.key&&CRED.email){try{await login();toast('Conectado');view()}catch(e){toast('No se pudo conectar: '+e.message)}}else toast('Configuración guardada')}
function cfgAuto(v){cfg.auto=v;cfgStore();setMsg(syncMsg||'automática '+(v?'activada':'desactivada'));if(v)sync()}
function setMsg(m,err){syncMsg=m;const a=$('#sy');if(a)a.textContent=m;let b=$('#cl');if(!b){b=document.createElement('div');b.id='cl';b.className='np';b.style.cssText='position:fixed;bottom:6px;right:8px;font-size:12px;padding:3px 8px;border-radius:10px;color:#fff;z-index:5';document.body.append(b)}b.style.display=cfg.auto&&cur?'block':'none';b.style.background=err?'#b3261e':'#2e7d32';b.textContent=(err?'☁ ✕ ':'☁ ✓ ')+m}
function refresh(){const a=document.activeElement,busy=a&&(a.tagName=='INPUT'||a.tagName=='SELECT')&&a.closest&&a.closest('#v')&&((a.id!='dor'&&a.id!='sal')||a.value);if(busy){pend=true;return}pend=false;view()}
let snap={},cfgSnap='',noET=false;
const rk=x=>{const{_m,...o}=x;return JSON.stringify(o)};
function stamp(init){const now=Date.now();['p','c','r','l'].forEach(t=>(S[t]||[]).forEach(x=>{if(!x.id)return;const k=rk(x);if(snap[x.id]!==k){snap[x.id]=k;if(!init)x._m=now}}));
 const ck=JSON.stringify([S.nombre,S.t,S.img]);if(ck!==cfgSnap){cfgSnap=ck;if(!init)S.cfgM=now}}
const fixP=p=>p.id?p:{...p,id:p.dorsal?'d'+p.dorsal:uid()};
function mergeT(a,b,del){const m=new Map();[...a,...b].forEach(x=>{if(!x.id||del.has(x.id))return;const o=m.get(x.id);if(!o||(x._m||0)>(o._m||0)||((x._m||0)==(o._m||0)&&JSON.stringify(x)>JSON.stringify(o)))m.set(x.id,x)});return[...m.values()]}
function dedup(p,del){const g={};p.forEach(x=>{const nm=(x.nombre+' '+x.apellidos).trim().toLowerCase();if(x.dorsal===''||x.dorsal==null||!nm)return;const k=x.dorsal+'|'+nm,o=g[k];if(!o){g[k]=x;return}const w=((x._m||0)>(o._m||0)||((x._m||0)==(o._m||0)&&x.id>o.id))?x:o;g[k]=w;del.add((w===x?o:x).id)});return p.filter(x=>!del.has(x.id))}
const fp=x=>JSON.stringify([['p','c','r','l'].map(t=>(x[t]||[]).map(a=>a.id+':'+(a._m||0)).sort()),(x.del||[]).slice().sort(),x.cfgM||0]);
async function fx(u,o,h){if(!noET)try{return await fetch(u,{...o,headers:h})}catch(e){noET=true}return fetch(u,o)}
async function sync(quiet){
 if(!cur||!cfg.url){if(!quiet)toast('Configura Firebase en la página de eventos');return}
 if(syncing)return;syncing=true;
 try{
  await tok();
  if(!S.cid){S.cid=uid()+uid();persist()}
  const U=fb('/eventos/'+S.cid);
  if(quiet&&lastKnown){const x=await fetch(fb('/indice/'+S.cid));if(x.ok){const ix=await x.json();if(ix&&ix.mod===lastKnown&&S.mod===lastKnown){setMsg('al día '+new Date().toLocaleTimeString());return}}}
  const b0=fp(S);let ok=false;
  for(let n=0;n<4&&!ok;n++){
   const r=await fx(U,{},{'X-Firebase-ETag':'true'});if(!r.ok)throw herr(r);
   const et=r.headers.get('ETag'),R=await r.json();let up=true;
   if(R){const d=unpack(R),del=new Set([...(S.del||[]),...(d.del||[])]);
    S.p=dedup(mergeT(S.p,d.p,del),del);S.c=mergeT(S.c,d.c,del);S.r=mergeT(S.r,d.r,del);S.l=mergeT(S.l,d.l,del).sort((x,y)=>x.ts-y.ts);S.del=[...del];
    if((d.cfgM||0)>(S.cfgM||0)){S.nombre=d.nombre;S.t=d.t;S.img=d.img;S.cfgM=d.cfgM}
    up=fp(S)!==fp(d);if(!up)S.mod=d.mod}
   if(up)S.mod=Date.now();
   snap={};cfgSnap='';stamp(1);persist();
   if(up){const w=await fx(U,{method:'PUT',body:JSON.stringify(pack(S))},et?{'if-match':et}:{});if(w.status==412)continue;if(!w.ok)throw herr(w);
    await fetch(fb('/indice/'+S.cid),{method:'PUT',body:JSON.stringify({nombre:S.nombre,mod:S.mod})})}
   ok=true}
  if(!ok)throw new Error('conflicto con otro dispositivo, se reintentará');
  lastKnown=S.mod;setMsg('sincronizado '+new Date().toLocaleTimeString());
  const ch=b0!==fp(S);
  if(ch){const dd={};S.p.forEach(x=>{if(x.dorsal!=='')dd[x.dorsal]=(dd[x.dorsal]||0)+1});if(Object.values(dd).some(n=>n>1))toast('Hay dorsales duplicados tras sincronizar: revisa las filas en rojo');refresh()}
  else if(!quiet)toast('Sincronizado')
 }catch(e){setMsg('error: '+(e.message||e),1);if(!quiet)toast('Error de sincronización: '+(e.message||e))}
 finally{syncing=false}}
async function nube(){if(!cfg.url)return toast('Escribe la URL y pulsa Guardar');
 try{await tok();const r=await fetch(fb('/indice'));if(!r.ok)throw herr(r);const I=(await r.json())||{},k=Object.keys(I);
  $('#nb').innerHTML=k.length?'<table>'+k.map(c=>`<tr><td>${esc(I[c].nombre)}<td>${new Date(I[c].mod).toLocaleString()}<td><button class="b" onclick="bajar('${c}')">Descargar a este dispositivo</button></tr>`).join('')+'</table>':'<i>No hay eventos en la nube</i>'}catch(e){toast('Error: '+e.message)}}
async function bajar(c){if(IDX.find(x=>x.cid==c))return toast('Ya está en este dispositivo: ábrelo y pulsa Sincronizar');
 try{await tok();const r=await fetch(fb('/eventos/'+c));if(!r.ok)throw herr(r);const d=unpack(await r.json());d.cid=c;nuevoEv(d);toast('Evento descargado');view()}catch(e){toast('Error: '+e.message)}}
setInterval(()=>{if(cur&&cfg.auto&&cfg.url&&S.cid){if(pend)refresh();sync(true)}},8000);
let F={p:{},c:{},r:{},m:{},k:{}};
const EXACT={p:['sexo','fed','loc','salio'],c:['sexo'],m:['dup']};
const iso2=n=>{const m=String(n||'').match(/^(\d{4})-(\d\d)-(\d\d)/);return m?m[3]+'/'+m[2]+'/'+m[1]:''};
function fmatch(t,vals){return Object.entries(F[t]).every(([k,f])=>{if(!f||!(k in vals))return true;const v=String(vals[k]??'').toLowerCase(),g=String(f).toLowerCase();return(EXACT[t]||[]).includes(k)?v===g:v.includes(g)})}
function fv(t,x){if(t=='p')return{dorsal:x.dorsal,nombre:x.nombre,apellidos:x.apellidos,club:x.club,nac:iso2(x.nac)||'sin fecha',sexo:x.sexo||'Vacío',fed:x.fed?'Sí':'No',loc:x.loc?'Sí':'No',salio:x.salio?'Sí':'No',anyo:yr(x)||'',cat:catOf(x)?.nombre||'sin categoría'};
 if(t=='c')return{nombre:x.nombre,ini:x.ini,fin:x.fin,sexo:x.sexo};
 return{nombre:x.nombre,hora:x.hora,cats:x.cats.map(id=>{const c=S.c.find(y=>y.id==id);return c?c.nombre+' '+c.sexo:''}).join(' ')}}
function fcell(t,k,opts){const v=F[t][k]||'',id='f_'+t+'_'+k;
 if(opts)return`<th><select id="${id}" onchange="fset('${t}','${k}',this.value)"><option value="">Todos</option>${opts.map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('')}</select>`;
 return`<th><input id="${id}" placeholder="filtrar" style="width:100%;min-width:60px" value="${esc(v)}" oninput="fset('${t}','${k}',this.value,'${id}')">`}
function fset(t,k,v,id){F[t][k]=v;view();if(id){const e=document.getElementById(id);if(e){e.focus();try{e.setSelectionRange(v.length,v.length)}catch(_){}}}}
function fclr(t){F[t]={};view()}
const slug=n=>(n||'evento').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w]+/g,'_').replace(/^_|_$/g,'')||'evento';
function dl(n,o){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));a.download=slug(n)+'.json';a.click()}
const load=id=>JSON.parse(localStorage.getItem('crono_ev_'+id));
function nuevoEv(d){const id=uid();localStorage.setItem('crono_ev_'+id,JSON.stringify(d));IDX.push({id,nombre:d.nombre,mod:Date.now(),cid:d.cid});idxSave();return id}
function migrar(){try{const old=localStorage.getItem('crono');if(old&&!IDX.length){const o=JSON.parse(old);o.nombre=o.nombre||'Evento anterior';nuevoEv(o)}}catch(e){}}
function crear(){const n=$('#en').value.trim();if(!n)return toast('Escribe un nombre para el evento');abrir(nuevoEv(newS(n)))}
function abrir(id){try{S=load(id);cur=id;FH=null;tab='p';S.p=S.p.map(fixP);snap={};cfgSnap='';stamp(1);lastKnown=0;F={p:{},c:{},r:{},m:{},k:{}};view()}catch(e){toast('No se pudo abrir el evento')}}
function salir(){cur=null;S=null;FH=null;view()}
function dup(id){const d=load(id);d.nombre+=' (copia)';delete d.cid;d.del=[];d.l=[];d.r.forEach(r=>r.t0=null);nuevoEv(d);view()}
async function borrarEv(id){if(await ask('¿Borrar este evento y todos sus datos? (descárgalo antes si quieres conservarlo)')){localStorage.removeItem('crono_ev_'+id);IDX=IDX.filter(x=>x.id!=id);idxSave();view()}}
function renEv(id,v){const d=load(id);d.nombre=v;d.cfgM=Date.now();d.mod=Date.now();localStorage.setItem('crono_ev_'+id,JSON.stringify(d));IDX.find(x=>x.id==id).nombre=v;idxSave()}
function descEv(id){const d=load(id);dl(d.nombre,pack(d))}
function importar(f){if(!f)return;const r=new FileReader();r.onload=e=>{try{const d=unpack(JSON.parse(e.target.result));nuevoEv(d);toast('Evento importado: '+d.nombre);view()}catch(x){toast('Archivo no válido')}};r.readAsText(f)}
async function vinc(){try{FH=await showSaveFilePicker({suggestedName:slug(S.nombre)+'.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]});save();toast('Fichero vinculado: se guardará con cada cambio');view()}catch(e){}}
function vHome(){const L=IDX.slice().sort((a,b)=>b.mod-a.mod);return`<h2>Eventos</h2>
<div class="card"><input id="en" placeholder="Nombre del nuevo evento" style="width:60%" onkeydown="if(event.key=='Enter')crear()"> <button class="b" onclick="crear()">+ Crear evento</button><br><br>Abrir evento desde fichero (.json): <input type=file accept=".json" onchange="importar(this.files[0]);this.value=''"></div>
${cfgHtml()}<div class="sc"><table><tr><th>Evento<th>Última modificación<th></tr>${L.map(e=>`<tr><td><input value="${esc(e.nombre)}" onchange="renEv('${e.id}',this.value)"><td>${new Date(e.mod).toLocaleString()}<td style="white-space:nowrap"><button class="b" onclick="abrir('${e.id}')">Abrir</button><button class="b" onclick="dup('${e.id}')">Duplicar</button><button class="b" onclick="descEv('${e.id}')">Descargar</button><button class="b r" onclick="borrarEv('${e.id}')">✕</button></tr>`).join('')||'<tr><td colspan=3><i>Aún no hay eventos. Crea el primero arriba.</i></tr>'}</table></div>
<p><small>Duplicar copia participantes, categorías y carreras, y deja vacías las llegadas y salidas (útil para la siguiente edición).</small></p>`}
function nav(){$('#nav').innerHTML=cur?`<button onclick="salir()">⌂ Eventos</button>`+Object.entries(tabs).map(([k,v])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';view()">${v}</button>`).join('')+`<span style="color:#fff;align-self:center;margin-left:8px">${esc(S.nombre)}${FH?' · 💾 vinculado':''}</span>`:'<b style="color:#fff;padding:8px">Cronometraje de carreras</b>'}
function inp(t,i,[k,l,ty]){const v=S[t][i][k];
 if(ty=='chk')return`<input type=checkbox ${v?'checked':''} onchange="ed('${t}',${i},'${k}',this.checked)">`;
 if(Array.isArray(ty))return`<select onchange="ed('${t}',${i},'${k}',this.value)">${v?'':'<option value=""></option>'}${ty.map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('')}</select>`;
 if(ty=='date'){const m=String(v||'').match(/^(\d{4})-(\d\d)-(\d\d)/);return`<input inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" style="width:105px" value="${m?m[3]+'/'+m[2]+'/'+m[1]:''}" oninput="fd(this,${i})">`}
 return`<input type="${ty||'text'}" value="${String(v??'').replace(/"/g,'&quot;')}" onchange="ed('${t}',${i},'${k}',this.type=='number'?+this.value:this.value)">`}
function fd(el,i){const d=el.value.replace(/\D/g,'').slice(0,8),f=d.length>4?d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4):d.length>2?d.slice(0,2)+'/'+d.slice(2):d;if(el.value!=f)el.value=f;
 let nac=null;if(!d)nac='';else if(d.length==8){const D=+d.slice(0,2),M=+d.slice(2,4),Y=+d.slice(4),t=new Date(Y,M-1,D);if(Y>=1900&&Y<=new Date().getFullYear()&&t.getMonth()==M-1&&t.getDate()==D)nac=`${Y}-${String(M).padStart(2,'0')}-${String(D).padStart(2,'0')}`}
 el.style.outline=d.length==8&&nac===null?'2px solid #b3261e':'';
 if(nac!==null){S.p[i].nac=nac;save();const y=$('#y'+i),k=$('#k'+i);if(y)y.textContent=yr(S.p[i])||'';if(k)k.innerHTML=catOf(S.p[i])?.nombre||'<i>sin categoría</i>'}}
function ed(t,i,k,v){if(t=='p'&&k=='dorsal'&&!v){S.p[i].dorsal='';save();return}
 if(t=='p'&&k=='dorsal'&&S.p.some((x,j)=>j!=i&&x.dorsal==v)){toast('Dorsal duplicado');return view()}
 S[t][i][k]=v;save();if(t=='p'&&k=='nac')view()}
function add(t){const o=T[t].nuevo();if(!o)return;
 if(t=='p'){S.p.unshift(o);if($('#q'))$('#q').value='';save();view();document.querySelector('#v table tr:nth-child(2) input')?.focus()}
 else{S[t].push(o);save();view()}}
async function del(t,i){if(await ask('¿Borrar este registro?')){(S.del=S.del||[]).push(S[t][i].id);S[t].splice(i,1);save();view()}}
function tcat(i,id){const a=S.r[i].cats,j=a.indexOf(id);j<0?a.push(id):a.splice(j,1);save()}
function tabla(t){const d=T[t];let q=t=='p'?($('#q')?.value||''):'';
 let h=`<h2>${d.n}</h2><button class="b" onclick="add('${t}')">+ Añadir</button>`;
 if(t=='p')h+=` <input id="q" placeholder="Buscar..." value="${q}" oninput="view();$('#q').focus()">`;
 const fr=`<tr class="np">${d.cols.map(c=>fcell(t,c[0],c[2]=='chk'?['Sí','No']:Array.isArray(c[2])?(t=='p'&&c[0]=='sexo'?[...c[2],'Vacío']:c[2]):null)).join('')}${t=='p'?fcell('p','anyo')+fcell('p','cat'):''}${t=='r'?fcell('r','cats'):''}<th><button class="b" onclick="fclr('${t}')">Limpiar</button></tr>`;
 h+=`<div class="sc"><table><tr>${d.cols.map(c=>`<th>${c[1]}`).join('')}${t=='p'?'<th>Año<th>Categoría':''}${t=='r'?'<th>Categorías':''}<th></tr>${fr}`;
const dd={};if(t=='p')S.p.forEach(x=>{dd[x.dorsal]=(dd[x.dorsal]||0)+1});
 S[t].forEach((x,i)=>{if(q&&!d.cols.map(c=>x[c[0]]).join(' ').toLowerCase().includes(q.toLowerCase()))return;
  if(!fmatch(t,fv(t,x)))return;
  const falta=t=='p'&&(!x.nac||!x.sexo),dupd=t=='p'&&x.dorsal!==''&&dd[x.dorsal]>1;
  h+=`<tr${falta?' style="background:#ffb3b3" title="Falta '+[!x.nac&&'fecha de nacimiento',!x.sexo&&'sexo'].filter(Boolean).join(' y ')+'"':dupd?' style="background:#ffd8a8" title="Dorsal duplicado"':''}>${d.cols.map(c=>`<td>${inp(t,i,c)}`).join('')}`;
  if(t=='p')h+=`<td id="y${i}">${yr(x)||''}<td id="k${i}">${catOf(x)?.nombre||'<i>sin categoría</i>'}`;
  if(t=='r')h+=`<td>${S.c.map(c=>`<label style="white-space:nowrap"><input type=checkbox ${x.cats.includes(c.id)?'checked':''} onchange="tcat(${i},'${c.id}')">${c.nombre} (${c.sexo})</label>`).join('<br>')}`;
  h+=`<td><button class="b r" onclick="del('${t}',${i})">✕</button></tr>`});
 return h+'</table></div>'}
// ---- Meta
async function salida(i){const r=S.r[i];if(r.t0&&!(await ask('Esta carrera ya tiene salida. ¿Reiniciar?')))return;r.t0=Date.now();save();view()}
function ajustar(i){const v=$('#aj'+i).value;if(!v)return toast('Escribe el tiempo, ej. 15:00');const p=v.split(':').map(Number).reverse();const ms=((p[2]||0)*3600+(p[1]||0)*60+(p[0]||0))*1000;S.r[i].t0=Date.now()-ms;save();view()}
function meta(){const ts=Date.now(),d=+$('#dor').value;if(!d)return;
 if(!S.p.some(x=>x.dorsal==d)){const id=(S.del||[]).includes('d'+d)?uid():'d'+d;S.p.unshift({id,dorsal:d,nombre:'',apellidos:'',club:'',nac:'',sexo:'',fed:false,loc:false,salio:false})}
 S.l.push({id:uid(),d,ts});save();view()}
function mins(){const m={};S.l.forEach(l=>{const o=m[l.d];if(!o||l.ts<o.ts||(l.ts==o.ts&&l.id<o.id))m[l.d]=l});return m}
function info(l){const p=S.p.find(x=>x.dorsal==l.d),c=p&&catOf(p),r=raceOf(c);return{p,c,r,ms:r&&r.t0?l.ts-r.t0:null}}
function editL(id,v){const l=S.l.find(x=>x.id==id),f=info(l);if(f.ms==null)return toast('La carrera no tiene salida');if(!v)return;const p=v.split(':').map(Number).reverse();l.ts=f.r.t0+((p[2]||0)*3600+(p[1]||0)*60+(p[0]||0))*1000;save();view()}
async function delL(id){if(await ask('¿Borrar llegada?')){(S.del=S.del||[]).push(id);S.l=S.l.filter(x=>x.id!=id);save();view()}}
function marcarSalida(){const e=$('#sal'),d=+e.value;if(!d)return;const p=S.p.find(x=>x.dorsal==d);
 if(!p){toast('El dorsal '+d+' no existe en participantes');e.value='';return}
 if(p.salio)toast('El dorsal '+d+' ya estaba marcado como salido');else{p.salio=true;p.tsal=Date.now();save()}
 view()}
function deshacerSalida(id){const p=S.p.find(x=>x.id==id);if(p){p.salio=false;delete p.tsal;save();view()}}
function vS(){const sal=S.p.filter(p=>p.salio).sort((a,b)=>(b.tsal||0)-(a.tsal||0));
 return`<h2>Control de salida</h2><div class="card"><b>Dorsal que sale:</b><br><input id="sal" type="text" inputmode="numeric" autocomplete="off" style="font-size:30px;width:160px" onkeydown="if(event.key=='Enter')marcarSalida()"> <button class="b" onclick="marcarSalida()">Marcar salida</button><br><small>Han salido ${sal.length} de ${S.p.length} participantes.</small></div>
<table><tr><th>Dorsal<th>Nombre<th>Carrera<th>Hora<th></tr>${sal.slice(0,30).map(p=>`<tr><td>${p.dorsal}<td>${esc(((p.nombre||'')+' '+(p.apellidos||'')).trim()||'sin datos')}<td>${esc(raceOf(catOf(p))?.nombre||'-')}<td>${p.tsal?new Date(p.tsal).toLocaleTimeString():'--'}<td><button class="b r" onclick="deshacerSalida('${p.id}')">Deshacer</button></tr>`).join('')}</table>`}
function cnt(){const M=mins(),k=S.r.map(()=>({l:0,s:0,e:0,q:0}));S.p.forEach(p=>{const r=raceOf(catOf(p));if(!r)return;const o=k[S.r.indexOf(r)],ar=!!M[p.dorsal];o.l++;if(p.salio)o.s++;if(ar)o.e++;if(p.salio&&!ar)o.q++});return k}
function vMeta(){const M=mins(),K=cnt();let h='<h2>Meta y cronómetro</h2>'+S.r.map((r,i)=>`<div class="card"><b>${r.nombre}</b> (prevista ${r.hora||'--'}${r.t0?' · salida real '+new Date(r.t0).toLocaleTimeString():''})<div class="clk" data-i="${i}">--:--:--</div><div style="margin:6px 0">En lista: <b>${K[i].l}</b> · Han salido: <b>${K[i].s}</b> · Han entrado: <b>${K[i].e}</b> · Quedan por entrar: <b>${K[i].q}</b></div><button class="b" onclick="salida(${i})">▶ Dar salida</button><br><input id="aj${i}" placeholder="mm:ss (ej. 15:00)" style="width:160px"><button class="b" onclick="ajustar(${i})">⏱ Ya llevan...</button></div>`).join('');
 h+=`<div class="card"><b>Dorsal que llega a meta:</b><br><input id="dor" type="number" onkeydown="if(event.key=='Enter')meta()" autofocus> <button class="b" onclick="meta()">Registrar</button></div>`;
 const fr=`<tr class="np">${['n','d','nom','cat','t'].map(k=>fcell('m',k)).join('')}${fcell('m','dup',['TRUE','FALSE'])}<th><button class="b" onclick="fclr('m')">Limpiar</button></tr>`,any=Object.values(F.m).some(Boolean);
 const rows=S.l.map((l,i)=>({l,n:i+1})).reverse().filter(({l,n})=>{const f=info(l),nm=f.p?(f.p.nombre+' '+f.p.apellidos).trim():'';return fmatch('m',{n,d:l.d,nom:nm||'sin datos',cat:f.c?.nombre||'-',t:f.ms==null?'--':fmt(f.ms),dup:M[l.d]!==l?'TRUE':'FALSE'})});
 h+='<table><tr><th>#<th>Dorsal<th>Nombre<th>Categoría<th>Tiempo<th>Duplicado<th></tr>'+fr+rows.slice(0,any?500:30).map(({l,n})=>{const f=info(l),du=M[l.d]!==l,sd=!f.p||!((f.p.nombre||'').trim()||(f.p.apellidos||'').trim());const nc=!f.c;return`<tr style="${sd?'background:#ffb3b3':nc?'background:#ffc078':du?'background:#fff3b0':''}"${nc&&!sd?' title="Sin categoría"':''}><td>${n}<td>${l.d}<td>${sd?'<i>sin datos</i>':esc(f.p.nombre+' '+f.p.apellidos)}<td>${f.c?.nombre||'-'}<td>${f.ms==null?'--':fmt(f.ms)}<td>${du?'<b>TRUE</b>':'FALSE'}<td><input value="${f.ms==null?'':fmt(f.ms)}" style="width:85px" title="Editar tiempo hh:mm:ss" onchange="editL('${l.id}',this.value)"><button class="b r" onclick="delL('${l.id}')">✕</button></tr>`}).join('')+'</table>'+(!any&&rows.length>30?'<small>Mostrando las 30 últimas llegadas; usa los filtros para ver el resto.</small>':'');
 return h}
setInterval(()=>document.querySelectorAll('.clk').forEach(e=>{const r=S&&S.r[e.dataset.i];e.textContent=r&&r.t0?fmt(Date.now()-r.t0):'--:--:--'}),200);
// ---- Resultados
function res(){const o={},M=mins();S.l.forEach(l=>{if(M[l.d]!==l)return;const f=info(l);if(!f.p||!f.c||f.ms==null)return;(o[f.c.id]=o[f.c.id]||[]).push({p:f.p,ms:f.ms})});Object.values(o).forEach(a=>a.sort((x,y)=>x.ms-y.ms));return o}
function rep(){const R=res(),K=F.k,im=k=>S.img[k]?`<img src="${S.img[k]}" style="width:100%">`:'',any=['pos','dorsal','nom','club','t'].some(k=>K[k]);
 return im('h')+`<h2>${S.t}</h2>`+S.c.filter(c=>R[c.id]&&(!K.cat||K.cat==c.id)).map(c=>{const rows=R[c.id].map((x,i)=>({x,i:i+1})).filter(({x,i})=>fmatch('k',{pos:i,dorsal:x.p.dorsal,nom:x.p.nombre+' '+x.p.apellidos,club:x.p.club,t:fmt(x.ms)}));if(any&&!rows.length)return'';
  return`<h3>${c.nombre}</h3><table><tr><th>Pos<th>Dorsal<th>Nombre<th>Club<th>Tiempo</tr>${rows.map(({x,i})=>`<tr><td>${i}<td>${x.p.dorsal}<td>${esc(x.p.nombre+' '+x.p.apellidos)}<td>${esc(x.p.club||'')}<td>${fmt(x.ms)}`).join('')}</table>`}).join('')+im('f')}
function vK(){return`<div class="np"><select id="fc" onchange="fset('k','cat',this.value)"><option value="">Todas las categorías</option>${S.c.map(c=>`<option value="${c.id}" ${F.k.cat==c.id?'selected':''}>${c.nombre}</option>`).join('')}</select> ${[['pos','Pos'],['dorsal','Dorsal'],['nom','Nombre'],['club','Club'],['t','Tiempo']].map(([k,l])=>`<input id="f_k_${k}" placeholder="${l}" style="width:100px" value="${esc(F.k[k]||'')}" oninput="fset('k','${k}',this.value,'f_k_${k}')">`).join(' ')} <button class="b" onclick="fclr('k')">Limpiar</button> <button class="b" onclick="imprimir()">🖨 Imprimir / PDF</button><button class="b" onclick="xl()">Exportar Excel</button><br><small>Los filtros afectan a la pantalla y a la impresión; el Excel exporta todos los resultados.</small></div><div id="rep">${rep()}</div>`}
function imprimir(){
 if(!document.querySelector('#rep table')){return toast('Aún no hay resultados que imprimir')}
 const h='<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+esc(S.t)+'</title><style>body{font-family:system-ui,sans-serif;margin:20px}table{border-collapse:collapse;width:100%;margin:8px 0}th,td{border:1px solid #999;padding:4px 6px;text-align:left}th{background:#e6ebf2}h3{page-break-after:avoid}tr{page-break-inside:avoid}img{max-width:100%}</style></head><body>'+rep()+'<script>setTimeout(function(){window.print()},500)<\/script></body></html>';
 const w=window.open('','_blank');
 if(!w){try{window.print()}catch(e){}toast('El navegador bloquea la impresión desde esta vista. Abre cronometraje.html directamente en el navegador (doble clic en el archivo) y vuelve a probar.');return}
 w.document.open();w.document.write(h);w.document.close()}
function xl(){const R=res(),wb=XLSX.utils.book_new();S.c.forEach(c=>{if(!R[c.id])return;XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Pos','Dorsal','Nombre','Apellidos','Club','Tiempo'],...R[c.id].map((x,i)=>[i+1,x.p.dorsal,x.p.nombre,x.p.apellidos,x.p.club,fmt(x.ms)])]),c.nombre.replace(/[\\\/?*\[\]:]/g,'').slice(0,31))});if(!wb.SheetNames.length)return toast('Aún no hay resultados');XLSX.writeFile(wb,'resultados.xlsx')}
// ---- Datos
function imp(f){const r=new FileReader();r.onload=e=>{const wb=XLSX.read(e.target.result,{cellDates:true}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);let n=0;
 rows.forEach(o=>{const g={};for(const k in o)g[k.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f\s_.]/g,'')]=o[k];
 let nac=g.fechanacimiento||g.nacimiento||g.nac||'';
 if(nac instanceof Date)nac=new Date(nac.getTime()-nac.getTimezoneOffset()*6e4).toISOString().slice(0,10);
 else if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(nac)){const[a,b,c]=nac.split('/');nac=`${c}-${b.padStart(2,'0')}-${a.padStart(2,'0')}`}
 else if(/^\d{4}$/.test(String(nac)))nac=nac+'-01-01';
 const si=v=>/^(s|si|sí|x|1|true|yes)/i.test(String(v||'').trim());
 const p={dorsal:+g.dorsal,nombre:g.nombre||'',apellidos:g.apellidos||'',club:g.club||'',nac:String(nac),sexo:/^(f|mu)/i.test(String(g.sexo||'').trim())?'F':'M',fed:si(g.federado),loc:si(g.local)};
 if(!p.dorsal)return;const i=S.p.findIndex(x=>x.dorsal==p.dorsal);p._m=Date.now();if(i<0){p.id=uid();p.salio=false;S.p.push(p)}else{p.id=S.p[i].id;p.salio=S.p[i].salio;if(S.p[i].tsal)p.tsal=S.p[i].tsal;S.p[i]=p}n++});
 save();toast(n+' participantes importados');view()};r.readAsArrayBuffer(f)}
function img(k,f){if(!f)return;const r=new FileReader();r.onload=e=>{S.img[k]=e.target.result;save();view()};r.readAsDataURL(f)}
function bak(){dl(S.nombre,pack(S))}
function rest(f){if(!f)return;const r=new FileReader();r.onload=async e=>{try{const d=unpack(JSON.parse(e.target.result));if(await ask('Esto reemplazará los datos de este evento por los del fichero. Con la sincronización activa, lo que no esté en el fichero también se borrará en la nube. ¿Continuar?')){const keep=new Set([...d.p,...d.c,...d.r,...d.l].map(x=>x.id)),ds=new Set([...(S.del||[]),...[...S.p,...S.c,...S.r,...S.l].filter(x=>x.id&&!keep.has(x.id)).map(x=>x.id)]);Object.assign(S,d);S.del=[...ds].filter(id=>!keep.has(id));save();view()}}catch(x){toast('Archivo no válido')}};r.readAsText(f)}
function vD(){return`<h2>Datos del evento</h2><div class="card"><b>Nombre del evento</b><br><input style="width:90%" value="${esc(S.nombre)}" onchange="S.nombre=this.value;save();nav()"></div>
<div class="card"><b>Título del informe</b><br><input style="width:90%" value="${S.t}" onchange="S.t=this.value;save()"><br><br>
Imagen cabecera: <input type=file accept="image/*" onchange="img('h',this.files[0])"> <button class="b r" onclick="S.img.h='';save();view()">Quitar</button><br>
Imagen pie: <input type=file accept="image/*" onchange="img('f',this.files[0])"> <button class="b r" onclick="S.img.f='';save();view()">Quitar</button></div>
<div class="card"><b>Importar participantes (Excel/CSV)</b><br>Columnas: dorsal, nombre, apellidos, club, fecha_nacimiento, sexo (M/F), federado, local<br><input type=file accept=".xlsx,.xls,.csv" onchange="imp(this.files[0])"></div>
<div class="card"><b>Fichero del evento (.json)</b><br>Contiene todas las tablas. Úsalo para llevar el evento a otro dispositivo, subirlo a la nube o archivarlo.<br><button class="b" onclick="bak()">Descargar evento</button> Cargar desde fichero: <input type=file accept=".json" onchange="rest(this.files[0]);this.value=''"><br>${FH?'Vinculado a <b>'+esc(FH.name)+'</b> (se guarda solo con cada cambio) <button class="b" onclick="FH=null;view()">Desvincular</button>':window.showSaveFilePicker?'<button class="b" onclick="vinc()">Vincular fichero (guardado automático)</button>':'<i>Tu navegador no permite vincular ficheros; usa Descargar evento.</i>'}</div>
<div class="card"><b>Sincronización con la nube</b><br>${cfg.url?`<button class="b" onclick="sync()">⇅ Sincronizar ahora</button> <label><input type=checkbox ${cfg.auto?'checked':''} onchange="cfgAuto(this.checked)"> Automática (cada pocos segundos)</label><div id="sy">${esc(syncMsg)}</div>`:'Configura Firebase en la página de eventos (botón ⌂ Eventos).'}</div>
<div class="card"><button class="b r" onclick="ask('¿Borrar TODAS las llegadas y salidas?').then(y=>{if(y){(S.del=S.del||[]).push(...S.l.map(x=>x.id));S.l=[];S.p.forEach(p=>{p.salio=false;delete p.tsal});S.r.forEach(r=>r.t0=null);save();view()}})">Reiniciar llegadas y salidas</button></div>`}
function ordenar(){S.c.sort((a,b)=>(a.ini-b.ini)||(a.fin-b.fin)||String(a.sexo).localeCompare(b.sexo));S.r.sort((a,b)=>(a.hora||'99:99').localeCompare(b.hora||'99:99'))}
function view(){nav();if(!cur){$('#v').innerHTML=vHome();return}ordenar();$('#v').innerHTML=tab=='m'?vMeta():tab=='s'?vS():tab=='k'?vK():tab=='d'?vD():tabla(tab);if(tab=='m')$('#dor')?.focus();if(tab=='s')$('#sal')?.focus()}
migrar();view();
</script></body></html>
