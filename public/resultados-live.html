<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados en Live</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            padding: 20px; 
            background-color: #f8f9fa;
            margin: 0;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .header-container h2 {
            margin: 0;
            color: #212529;
        }

        .banner-imagen {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: block;
        }

        #contenedor-tabla { 
            width: 100%; 
            overflow-x: auto; 
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            padding: 16px;
            box-sizing: border-box;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
        }

        th, td { 
            border: 1px solid #e9ecef; 
            padding: 10px 12px; 
            text-align: left; 
        }

        th { 
            background-color: #0d6efd; 
            color: white; 
            font-weight: 600;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .estado {
            font-size: 0.9em;
            color: #6c757d;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h2>Clasificación en Directo</h2>
        <span id="estado" class="estado">Cargando...</span>
    </div>

    <img 
        class="banner-imagen" 
        src="https://masatletismocrono.com/wp-content/uploads/header-bg.jpg" 
        alt="Cabecera Evento Deportivo"
        onerror="this.src='https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=1200&q=80'"
    >

    <div id="contenedor-tabla">Cargando datos...</div>

    <script>
        let segundosRestantes = 30;
        let ultimaHoraActualizacion = '--:--:--';
        let cargando = false;

        async function cargarDatos() {
    if (cargando) return;
    cargando = true;

    const contenedor = document.getElementById('contenedor-tabla');
    const estado = document.getElementById('estado');

    if (estado) estado.textContent = 'Actualizando...';

    try {
        const response = await fetch('/api/get-csv-internal');

        // Si la respuesta no es OK (HTTP 404, 500, etc.) o no es JSON:
        if (!response.ok) {
            const textoError = await response.text();
            throw new Error(`Servidor devolvió HTTP ${response.status}: ${textoError.substring(0, 150)}...`);
        }

        const data = await response.json();

        generarTabla(data);

        ultimaHoraActualizacion = new Date().toLocaleTimeString();
        segundosRestantes = 30;
        cargando = false;

        actualizarTextoEstado();

    } catch (error) {
        console.error('Error al actualizar datos:', error);
        cargando = false;

        if (contenedor && (!contenedor.querySelector('table') || contenedor.innerHTML.includes('Error'))) {
            contenedor.innerHTML = `<p style="color:red; font-weight:bold;">Error en la carga: ${error.message}</p>`;
        }
        if (estado) {
            estado.textContent = 'Error al actualizar. Reintentando en breve...';
        }
    }
}
        function actualizarTextoEstado() {
            const estado = document.getElementById('estado');
            if (estado && !cargando) {
                estado.textContent = `Última actualización: ${ultimaHoraActualizacion} | Próxima actualización en ${segundosRestantes}s`;
            }
        }

        setInterval(() => {
            if (cargando) return;

            segundosRestantes--;

            if (segundosRestantes <= 0) {
                cargarDatos();
            } else {
                actualizarTextoEstado();
            }
        }, 1000);

        function tiempoASegundos(tiempoStr) {
            if (!tiempoStr) return -1;
            const str = tiempoStr.toString().trim();
            const partes = str.split(':').map(Number);

            if (partes.length === 3) return (partes[0] * 3600) + (partes[1] * 60) + partes[2];
            if (partes.length === 2) return (partes[0] * 60) + partes[1];
            
            const num = parseFloat(str);
            return isNaN(num) ? -1 : num;
        }

        function generarTabla(filas) {
            const contenedor = document.getElementById('contenedor-tabla');
            if (!contenedor) return;

            if (!filas || filas.length === 0) {
                contenedor.innerHTML = '<p>No hay datos disponibles.</p>';
                return;
            }

            const cabeceras = filas[0];
            let datos = filas.slice(1);

            const idxTiempo = cabeceras.findIndex(h => 
                h.trim().toLowerCase().includes('tiempo') || 
                h.trim().toLowerCase().includes('time') ||
                h.trim().toLowerCase().includes('marca')
            );

            if (idxTiempo !== -1) {
                datos.sort((a, b) => {
                    const segA = tiempoASegundos(a[idxTiempo]);
                    const segB = tiempoASegundos(b[idxTiempo]);
                    return segB - segA;
                });
            }

            let html = '<table><thead><tr>';
            cabeceras.forEach(col => { html += `<th>${col}</th>`; });
            html += '</tr></thead><tbody>';

            datos.forEach(fila => {
                html += '<tr>';
                fila.forEach(celda => { html += `<td>${celda || ''}</td>`; });
                html += '</tr>';
            });

            html += '</tbody></table>';
            contenedor.innerHTML = html;
        }

        cargarDatos();
    </script>
</body>
</html>
