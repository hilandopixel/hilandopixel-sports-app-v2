<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados en Live</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            padding: 20px; 
            background-color: #f8f9fa;
            margin: 0;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .header-container h2 {
            margin: 0;
            color: #212529;
        }

        .banner-imagen {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: block;
        }

        #contenedor-tabla { 
            width: 100%; 
            overflow-x: auto; 
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            padding: 16px;
            box-sizing: border-box;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
        }

        th, td { 
            border: 1px solid #e9ecef; 
            padding: 8px 10px; 
            text-align: left; 
        }

        th { 
            background-color: #0d6efd; 
            color: white; 
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }

        th:hover {
            background-color: #0b5ed7;
        }

        /* Estilos para los inputs de filtro por columna */
        .input-filtro {
            width: 100%;
            padding: 4px 6px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 0.85em;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .estado {
            font-size: 0.9em;
            color: #6c757d;
            font-weight: 500;
        }

        .indicador-orden {
            font-size: 0.8em;
            margin-left: 4px;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h2>Clasificación en Directo</h2>
        <span id="estado" class="estado">Cargando...</span>
    </div>

    <img 
        class="banner-imagen" 
        src="https://masatletismocrono.com/wp-content/uploads/header-bg.jpg" 
        alt="Cabecera Evento Deportivo"
        onerror="this.src='https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=1200&q=80'"
    >

    <div id="contenedor-tabla">Cargando datos...</div>
<script>
    let segundosRestantes = 30;
    let ultimaHoraActualizacion = '--:--:--';
    let cargando = false;

    // Estado global
    let datosOriginales = [];
    let cabecerasGlobales = [];
    let columnaOrdenadaIdx = -1;
    let ordenAscendente = true;
    let filtrosPorColumna = {};

    // Variables para preservar el foco durante la escritura
    let inputFocoIdx = null;
    let posicionCursor = 0;

    async function cargarDatos() {
        if (cargando) return;
        cargando = true;

        const contenedor = document.getElementById('contenedor-tabla');
        const estado = document.getElementById('estado');

        if (estado) estado.textContent = 'Actualizando...';

        try {
            const response = await fetch('/api/get-csv');
            const contentType = response.headers.get('content-type');
            if (!contentType || !contentType.includes('application/json')) {
                throw new Error('La API no devolvió JSON (Asegúrate de ejecutar con "npx vercel dev").');
            }

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || `Error HTTP ${response.status}`);
            }

            if (data && data.length > 0) {
                cabecerasGlobales = data[0];
                datosOriginales = data.slice(1);

                if (columnaOrdenadaIdx === -1) {
                    columnaOrdenadaIdx = cabecerasGlobales.findIndex(h => 
                        h.trim().toLowerCase().includes('tiempo') || 
                        h.trim().toLowerCase().includes('time') ||
                        h.trim().toLowerCase().includes('marca')
                    );
                    ordenAscendente = false;
                }
            }

            renderizarTabla();

            ultimaHoraActualizacion = new Date().toLocaleTimeString();
            segundosRestantes = 30;
            cargando = false;

            actualizarTextoEstado();

        } catch (error) {
            console.error('Error al actualizar datos:', error);
            cargando = false;

            if (contenedor && (!contenedor.querySelector('table') || contenedor.innerHTML.includes('Error'))) {
                contenedor.innerHTML = `<p style="color:red; font-weight:bold;">Error en la carga: ${error.message}</p>`;
            }
            if (estado) {
                estado.textContent = 'Error al actualizar. Reintentando en breve...';
            }
        }
    }

    function actualizarTextoEstado() {
        const estado = document.getElementById('estado');
        if (estado && !cargando) {
            estado.textContent = `Última actualización: ${ultimaHoraActualizacion} | Próxima actualización en ${segundosRestantes}s`;
        }
    }

    setInterval(() => {
        if (cargando) return;
        segundosRestantes--;

        if (segundosRestantes <= 0) {
            cargarDatos();
        } else {
            actualizarTextoEstado();
        }
    }, 1000);

    function tiempoASegundos(tiempoStr) {
        if (!tiempoStr) return -1;
        const str = tiempoStr.toString().trim();
        const partes = str.split(':').map(Number);

        if (partes.length === 3) return (partes[0] * 3600) + (partes[1] * 60) + partes[2];
        if (partes.length === 2) return (partes[0] * 60) + partes[1];
        
        const num = parseFloat(str);
        return isNaN(num) ? -1 : num;
    }

    function ordenarPorColumna(colIdx) {
        if (columnaOrdenadaIdx === colIdx) {
            ordenAscendente = !ordenAscendente;
        } else {
            columnaOrdenadaIdx = colIdx;
            ordenAscendente = true;
        }
        renderizarTabla();
    }

    // Captura del filtro guardando el índice del input y la posición del cursor
    function aplicarFiltro(colIdx, inputElem) {
        inputFocoIdx = colIdx;
        posicionCursor = inputElem.selectionStart;
        filtrosPorColumna[colIdx] = inputElem.value.toLowerCase();
        renderizarTabla();
    }

    function renderizarTabla() {
        const contenedor = document.getElementById('contenedor-tabla');
        if (!contenedor) return;

        if (!datosOriginales || datosOriginales.length === 0) {
            contenedor.innerHTML = '<p>No hay datos disponibles.</p>';
            return;
        }

        // 1. Filtrar los datos
        let datosProcesados = datosOriginales.filter(fila => {
            return Object.keys(filtrosPorColumna).every(colIdx => {
                const textoFiltro = filtrosPorColumna[colIdx];
                if (!textoFiltro) return true;
                const celdaTexto = (fila[colIdx] || '').toString().toLowerCase();
                return celdaTexto.includes(textoFiltro);
            });
        });

        // 2. Ordenar los datos
        if (columnaOrdenadaIdx !== -1) {
            const esColumnaTiempo = cabecerasGlobales[columnaOrdenadaIdx].trim().toLowerCase().includes('tiempo') ||
                                    cabecerasGlobales[columnaOrdenadaIdx].trim().toLowerCase().includes('time') ||
                                    cabecerasGlobales[columnaOrdenadaIdx].trim().toLowerCase().includes('marca');

            datosProcesados.sort((a, b) => {
                let valA = a[columnaOrdenadaIdx] || '';
                let valB = b[columnaOrdenadaIdx] || '';

                let comp = 0;
                if (esColumnaTiempo) {
                    const segA = tiempoASegundos(valA);
                    const segB = tiempoASegundos(valB);
                    comp = segA - segB;
                } else {
                    const numA = parseFloat(valA);
                    const numB = parseFloat(valB);
                    if (!isNaN(numA) && !isNaN(numB)) {
                        comp = numA - numB;
                    } else {
                        comp = valA.toString().localeCompare(valB.toString());
                    }
                }

                return ordenAscendente ? comp : -comp;
            });
        }

        // 3. Generar la estructura HTML
        let html = '<table><thead><tr>';

        cabecerasGlobales.forEach((col, idx) => {
            let indicador = '';
            if (idx === columnaOrdenadaIdx) {
                indicador = ordenAscendente ? ' ▲' : ' ▼';
            }
            html += `<th onclick="ordenarPorColumna(${idx})">
                        ${col}<span class="indicador-orden">${indicador}</span>
                     </th>`;
        });
        html += '</tr><tr>';

        cabecerasGlobales.forEach((_, idx) => {
            const valActual = filtrosPorColumna[idx] || '';
            html += `<th>
                        <input type="text" 
                               id="filtro-col-${idx}"
                               class="input-filtro" 
                               placeholder="Filtrar..." 
                               value="${valActual}" 
                               onclick="event.stopPropagation()" 
                               oninput="aplicarFiltro(${idx}, this)">
                     </th>`;
        });

        html += '</tr></thead><tbody>';

        datosProcesados.forEach(fila => {
            html += '<tr>';
            fila.forEach(celda => { html += `<td>${celda || ''}</td>`; });
            html += '</tr>';
        });

        html += '</tbody></table>';
        contenedor.innerHTML = html;

        // 4. Restaurar el foco y el cursor si se estaba escribiendo en un input
        if (inputFocoIdx !== null) {
            const inputActivo = document.getElementById(`filtro-col-${inputFocoIdx}`);
            if (inputActivo) {
                inputActivo.focus();
                inputActivo.setSelectionRange(posicionCursor, posicionCursor);
            }
        }
    }

    // Carga inicial
    cargarDatos();
</script>
</body>
</html>
