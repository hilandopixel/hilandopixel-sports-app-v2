<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Información de carreras del Evento</title>
  <link rel="stylesheet" href="style2.css">

  <!-- Tailwind CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <style>
    .info-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    .info-table th, .info-table td {
      border: 1px solid #e5e7eb;
      padding: 12px;
      text-align: left;
      font-size: 14px;
    }
    .info-table th {
      background-color: #f9fafb;
      font-weight: 600;
    }
    
    .vista-movil-cards {
      display: grid;
      gap: 1rem;
    }
    .vista-escritorio-tabla {
      display: none;
    }

    @media (min-width: 1024px) {
      .vista-movil-cards {
        display: none !important;
      }
      .vista-escritorio-tabla {
        display: block !important;
        overflow-x: auto;
      }
    }
  </style>
  <script src="./navbar.js" defer></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <navbar-header></navbar-header>

  <main class="max-w-7xl mx-auto p-4 sm:p-6 bg-white shadow-md rounded-lg my-6 sm:my-10 space-y-6">
    <!-- Cabecera -->
    <div class="flex justify-between items-center border-b pb-4">
      <div>
        <h1 id="eventoTitulo" class="text-2xl font-bold text-primary">Información de carreras</h1>
        <p id="eventoSubtitulo" class="text-xs text-gray-500 mt-1">Cargando rutas del evento...</p>
      </div>
      <a href="javascript:history.back()" class="btn-secondary text-xs py-2 px-4">← Volver</a>
    </div>

    <!-- Buscador y Contador -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <span class="text-sm font-semibold text-gray-600">Total de carreras: </span>
        <span id="carrerasCount" class="text-base font-bold text-indigo-600">0</span>
      </div>
      <div class="w-full md:w-72">
        <input type="text" id="carrerasearchInput" placeholder="🔍 Buscar por nombre o ID..." class="w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-2 focus:ring-indigo-500 bg-white">
      </div>
    </div>

    <!-- VISTA MÓVIL / TABLET (Tarjetas) -->
    <div id="carrerasCardsContainer" class="vista-movil-cards">
      <div class="text-center text-gray-500 py-8 bg-gray-50 rounded-lg border">Cargando carreras...</div>
    </div>

    <!-- VISTA ESCRITORIO (Tabla Completa) -->
    <div class="vista-escritorio-tabla">
      <table id="carrerasTable" class="info-table">
        <thead>
          <tr>
            <th>Nombre del Track</th>
            <th>Distancia</th>
            <th>Desnivel</th>
            <th>Hora Salida</th>
            <th>Hora 1º (Meta)</th>
            <th>Hora Último (Fin)</th>
            <th>Ritmo 1º</th>
            <th>Ritmo Último</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="9" class="text-center text-gray-500 py-6">Cargando carreras...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script type="module">
    import { db } from './firebase.config.js';
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const urlParams = new URLSearchParams(window.location.search);
    let eventoId = urlParams.get('evento') || sessionStorage.getItem('eventoActivoTrack');

    let carrerasCache = [];

    async function cargarTodosLoscarreras() {
      if (!eventoId) {
        document.getElementById('eventoTitulo').textContent = "Error: Evento no especificado";
        document.getElementById('eventoSubtitulo').textContent = "Asegúrate de pasar el parámetro ?evento=ID_DEL_EVENTO en la URL.";
        return;
      }

      document.getElementById('eventoSubtitulo').textContent = `Evento: ${eventoId}`;

      try {
        const refColeccion = collection(db, 'eventos', eventoId, 'tracks');
        const querySnapshot = await getDocs(refColeccion);

        carrerasCache = [];

        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          
          let horaPrimeroMeta = '-';
          if (data.waypoints && data.waypoints.length > 0) {
            const lastWpt = data.waypoints[data.waypoints.length - 1];
            horaPrimeroMeta = lastWpt.hourFirstStr || '-';
          }

          // Enlace personalizado desde trackUrl en Firebase (o alternativa por defecto)
          const urlAccion = data.trackUrl 
            ? data.trackUrl 
            : `carreras.html?evento=${encodeURIComponent(eventoId)}&track=${encodeURIComponent(docSnap.id)}`;

          carrerasCache.push({
            id: docSnap.id,
            title: data.title || docSnap.id,
            distancia: data.totalDistance || '-',
            elevation: data.elevation || 'D+: - | D-: -',
            horaSalida: data.horaInicio || '23:59',
            horaPrimero: horaPrimeroMeta,
            horaUltimo: data.horaFin || '-',
            ritmoPrimero: data.ritmoPrimeroMinKm ? `${data.ritmoPrimeroMinKm} min/km` : '-',
            ritmoUltimo: data.ritmoUltimoMinKm ? `${data.ritmoUltimoMinKm} min/km` : '-',
            trackUrl: urlAccion
          });
        });

        // Ordenar por hora de inicio (horaSalida) en sentido ascendente
        carrerasCache.sort((a, b) => a.horaSalida.localeCompare(b.horaSalida));

        document.getElementById('carrerasCount').textContent = carrerasCache.length;
        renderizarcarreras(carrerasCache);

        document.getElementById('carrerasearchInput').addEventListener('input', function(e) {
          const query = e.target.value.toLowerCase().trim();
          const filtrados = carrerasCache.filter(t => 
            t.title.toLowerCase().includes(query) || t.id.toLowerCase().includes(query)
          );
          renderizarcarreras(filtrados);
        });

      } catch (error) {
        console.error("Error al obtener los carreras de Firebase:", error);
        alert("Hubo un error al cargar los carreras desde Firebase.");
      }
    }

    function renderizarcarreras(lista) {
      const cardsContainer = document.getElementById('carrerasCardsContainer');
      const tableBody = document.querySelector('#carrerasTable tbody');

      cardsContainer.innerHTML = '';
      tableBody.innerHTML = '';

      if (lista.length === 0) {
        cardsContainer.innerHTML = `<div class="text-center text-gray-500 py-8 bg-gray-50 rounded-lg border">No se encontraron carreras en este evento.</div>`;
        tableBody.innerHTML = `<tr><td colspan="9" class="text-center text-gray-500 py-6">No se encontraron carreras en este evento.</td></tr>`;
        return;
      }

      lista.forEach((track) => {
        // 1. Tarjeta Vista Móvil
        const card = document.createElement('div');
        card.className = "bg-white border border-gray-200 rounded-lg p-5 shadow-sm space-y-4 hover:shadow-md transition";
        card.innerHTML = `
          <div class="flex justify-between items-start border-b pb-3">
            <div>
              <h2 class="font-bold text-lg text-indigo-700">${track.title}</h2>
              <span class="text-xs text-gray-400">ID: ${track.id}</span>
            </div>
            <span class="bg-indigo-100 text-indigo-800 text-xs font-semibold px-3 py-1 rounded-full">${track.distancia}</span>
          </div>

          <div class="grid grid-cols-2 gap-3 text-xs">
            <div class="bg-gray-50 p-2.5 rounded">
              <span class="text-gray-500 block">🚀 Hora Salida</span>
              <span class="font-bold text-gray-800 text-sm">${track.horaSalida}</span>
            </div>
            <div class="bg-gray-50 p-2.5 rounded">
              <span class="text-gray-500 block">⛰️ Desnivel</span>
              <span class="font-bold text-gray-800 text-sm">${track.elevation}</span>
            </div>
            <div class="bg-indigo-50/60 p-2.5 rounded">
              <span class="text-gray-500 block">🥇 1º Participante (Meta)</span>
              <span class="font-bold text-indigo-700 text-sm">${track.horaPrimero}</span>
              <span class="text-[10px] text-gray-500 block mt-0.5">Ritmo: ${track.ritmoPrimero}</span>
            </div>
            <div class="bg-orange-50/60 p-2.5 rounded">
              <span class="text-gray-500 block">🏁 Último (Meta / Fin)</span>
              <span class="font-bold text-orange-700 text-sm">${track.horaUltimo}</span>
              <span class="text-[10px] text-gray-500 block mt-0.5">Ritmo: ${track.ritmoUltimo}</span>
            </div>
          </div>

          <a href="${track.trackUrl}" class="block text-center w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded text-xs transition">
            🗺️ Ver Track
          </a>
        `;
        cardsContainer.appendChild(card);

        // 2. Fila Vista Escritorio
        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="font-bold text-gray-800">
            ${track.title}
            <span class="block text-xs font-normal text-gray-400">ID: ${track.id}</span>
          </td>
          <td class="font-semibold text-indigo-600">${track.distancia}</td>
          <td class="text-xs text-gray-600">${track.elevation}</td>
          <td><span class="font-bold text-gray-800">${track.horaSalida}</span></td>
          <td>
            <span class="font-bold text-indigo-600">${track.horaPrimero}</span>
            <span class="block text-[11px] text-gray-500">${track.ritmoPrimero}</span>
          </td>
          <td>
            <span class="font-bold text-orange-600">${track.horaUltimo}</span>
            <span class="block text-[11px] text-gray-500">${track.ritmoUltimo}</span>
          </td>
          <td class="text-xs">${track.ritmoPrimero}</td>
          <td class="text-xs">${track.ritmoUltimo}</td>
          <td>
            <a href="${track.trackUrl}" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-3 py-1.5 rounded text-xs inline-block">
              🗺️ Ver Track
            </a>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    cargarTodosLoscarreras();
  </script>
</body>
</html>
