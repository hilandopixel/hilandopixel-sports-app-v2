<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla Actualizada vía Vercel</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
        }

        #contenedor-tabla {
            width: 100%;
            overflow-x: auto;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            padding: 16px;
            box-sizing: border-box;
        }

        /* Estilos aplicados dinámicamente a la tabla importada */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #e9ecef;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #0d6efd;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>

    <h2>Tabla en Tiempo Real</h2>
    <div id="contenedor-tabla">Cargando datos...</div>

    <script>
        async function actualizarTabla() {
            const contenedor = document.getElementById('contenedor-tabla');

            try {
                // Llama a la Vercel Function en la ruta relativa /api/get-table
                const response = await fetch('/api/get-table');
                
                if (!response.ok) throw new Error('Error al obtener la tabla');

                const htmlTabla = await response.text();
                contenedor.innerHTML = htmlTabla;
            } catch (error) {
                console.error(error);
                contenedor.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`;
            }
        }

        // Carga inicial
        actualizarTabla();

        // Refrescar automáticamente cada 5 segundos
        setInterval(actualizarTabla, 10000);
    </script>

</body>
</html>
