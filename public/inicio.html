<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos</title>
  <link rel="stylesheet" href="style.css">
  <script src="./navbar.js" defer></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <navbar-header></navbar-header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-8 border-b pb-4 border-gray-200">
      <h1 class="text-3xl font-extrabold text-primary tracking-tight">Próximos Eventos</h1>
    </div>

    <div id="gridEventos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <p class="text-gray-500 col-span-full">Cargando eventos disponibles...</p>
    </div>
  </main>

  <script type="module">
    import { db } from './firebase.config.js';
    import { collection, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const gridEventos = document.getElementById("gridEventos");

    function formatearFecha(fechaStr) {
      if (!fechaStr) return 'Fecha por confirmar';
      const partes = fechaStr.split('-');
      if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
      return fechaStr;
    }

    // QUERY CON FILTRO DE EVENTOS OCULTOS
    const qEventos = query(collection(db, "eventos"), where("oculto", "!=", true));

    onSnapshot(qEventos, (snapshot) => {
      gridEventos.innerHTML = "";
      if (snapshot.empty) {
        gridEventos.innerHTML = "<p class='text-gray-500 col-span-full'>No hay eventos disponibles actualmente.</p>";
        return;
      }

      snapshot.forEach((docSnap) => {
        const ev = docSnap.data();
        const id = docSnap.id;
        const urlEvento = `evento.html?slug=${ev.slug || id}`;
        const fechaFormateada = formatearFecha(ev.fecha);
        const horaTexto = ev.hora ? ` - ⏰ ${ev.hora}` : '';
        const esFinalizado = Boolean(ev.finalizado);

        const badgeFinalizado = esFinalizado 
          ? `<span class="inline-block bg-red-100 text-red-700 text-[10px] font-black px-2.5 py-1 rounded-full border border-red-200 uppercase tracking-wider mb-2">🏁 EVENTO FINALIZADO</span>` 
          : '';

        const botonHtml = esFinalizado
          ? `<a href="${urlEvento}" class="btn-secondary w-full text-center text-sm font-bold bg-gray-200 text-gray-700 hover:bg-gray-300">🏁 Evento Finalizado</a>`
          : `<a href="${urlEvento}" class="btn-primary w-full text-center text-sm" ${ev.color ? `style="background-color: ${ev.color};"` : ''}>Ver Detalle e Inscribirse</a>`;

        const card = document.createElement("div");
        card.className = "card-evento-el relative";
        card.innerHTML = `
          <a href="${urlEvento}" class="block overflow-hidden">
            <img src="${ev.imagen || 'https://via.placeholder.com/400x200?text=Sin+Imagen'}" class="card-img-el hover:scale-105 transition-transform duration-300 ${esFinalizado ? 'grayscale opacity-80' : ''}" alt="${ev.nombre}">
          </a>
          <div class="p-5 flex flex-col flex-grow">
            <div>${badgeFinalizado}</div>
            <h3 class="text-lg font-bold text-primary mb-2">
              <a href="${urlEvento}" class="hover:text-primary transition-colors">${ev.nombre}</a>
            </h3>
            <p class="text-xs font-semibold text-primary mb-3">📅 ${fechaFormateada}${horaTexto}</p>
            <p class="text-sm text-gray-600 mb-4 flex-grow line-clamp-3">${ev.descripcion || 'Sin descripción.'}</p>
            <div class="flex gap-2 mt-auto">
              ${botonHtml}
            </div>
          </div>
        `;
        gridEventos.appendChild(card);
      });
    });
  </script>
</body>
</html>
